# ทุก 15 นาที: อ่านระดับน้ำใกล้เขตทั้ง 928 เขตจากหน้าเว็บ checknam.com แล้วส่งให้เว็บเก็บไว้ใช้เป็นหัวข้อลิงก์ตอนแชร์
name: zones
on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
concurrency:
  group: zones
  cancel-in-progress: true
jobs:
  zones:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: npm i --no-save --silent puppeteer-core@23 >/dev/null 2>&1
      - env:
          KEY: ${{ secrets.SNAP_KEY }}
        run: node zones.js
