# ตัวดึงข้อมูลสำรองบนคลาวด์ของ checknam.com: ทุก 5 นาที ดึงข้อมูลน้ำจากคลังข้อมูลน้ำแห่งชาติแล้วส่งสำเนาไปเก็บที่เว็บ
# ถ้าเครื่องที่บ้านเพิ่งส่งไปแล้ว (สำเนาอายุไม่ถึง 4 นาที) จะข้ามรอบนั้น · ต้องมี secret ชื่อ SNAP_KEY (ค่าเดียวกับ .snapkey ที่บ้าน)
name: snapshot
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: snapshot
  cancel-in-progress: false
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: snapshot
        env:
          KEY: ${{ secrets.SNAP_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ -z "$KEY" ]; then echo "::notice::ยังไม่ได้ตั้ง secret SNAP_KEY จึงข้าม"; exit 0; fi
          UP="https://api-v3.thaiwater.net/api/v1/thaiwater30/public/"; UA="checknam.com snapshot (+https://checknam.com)"
          INFO=$(curl -s -m 15 -H "x-key: $KEY" "https://checknam.com/api/snap" || true)
          age(){ printf '%s' "$INFO" | sed -n "s/.*\"k\":\"$1\",\"ageMin\":\([0-9]*\).*/\1/p"; }
          WA=$(age waterlevel_load); DA=$(age dams); echo "สำเนาตอนนี้: ระดับน้ำ ${WA:-?} นาที · เขื่อน ${DA:-?} นาที · ฝน $(age rain_24h) นาที"
          JOBS=""
          if [ "$FORCE" = true ] || [ -z "$WA" ] || [ "$WA" -ge 4 ]; then JOBS="waterlevel_load"; fi
          if [ "$FORCE" = true ] || [ -z "$DA" ] || [ "$DA" -ge 55 ]; then JOBS="$JOBS thailand_main"; fi
          RA=$(age rain_24h); if [ "$FORCE" = true ] || [ -z "$RA" ] || [ "$RA" -ge 9 ]; then JOBS="$JOBS rain_24h"; fi
          [ -z "$JOBS" ] && { echo "เครื่องที่บ้านเพิ่งส่งแล้ว ข้ามรอบนี้"; exit 0; }
          FAIL=0
          for k in $JOBS; do
            CODE=$(curl -s -m 60 --retry 2 --retry-delay 5 -A "$UA" -o "t-$k.json" -w "%{http_code}" "$UP$k" || echo 000)
            SIZE=$( [ -f "t-$k.json" ] && wc -c < "t-$k.json" | tr -d ' ' || echo 0)
            if [ "$CODE" = 200 ] && [ "$SIZE" -gt 2000 ]; then
              if [ "$k" = thailand_main ]; then node trim-dams.js "t-$k.json" t-dams.json && F=t-dams.json && K=dams || { echo "::warning::ตัดข้อมูลเขื่อนไม่สำเร็จ"; continue; }; else F="t-$k.json"; K=$k; fi
              RES=$(curl -s -m 60 -X POST -H "x-key: $KEY" -H "Content-Type: application/json" --data-binary "@$F" "https://checknam.com/api/snap?k=$K")
              echo "$K src=$CODE size=$SIZE push=$RES"; case "$RES" in *'"ok":true'*) ;; *) FAIL=1;; esac
            else echo "::warning::$k ดึงจากต้นทางไม่ได้ src=$CODE size=$SIZE"; FAIL=1; fi
          done
          exit $FAIL
