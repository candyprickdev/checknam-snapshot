name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq fonts-thai-tlwg >/dev/null 2>&1 || true
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');const S='https://stage.checknam.pages.dev';const fs=require('fs');const W=ms=>new Promise(r=>setTimeout(r,ms));
          const chk=()=>{const cw=document.documentElement.clientWidth,sw=document.documentElement.scrollWidth;const bad=[];
          const clipped=e=>{for(let a=e.parentElement;a&&a!==document.body;a=a.parentElement){const s=getComputedStyle(a);if(/(hidden|auto|scroll|clip)/.test(s.overflowX)){const r=a.getBoundingClientRect();if(r.right<=cw+1)return true;}if(s.position==='fixed')return true;}return false;};
          document.querySelectorAll('body *').forEach(e=>{const s=getComputedStyle(e);if(s.display==='none'||s.visibility==='hidden'||s.position==='fixed')return;const r=e.getBoundingClientRect();if(r.width>0&&r.height>0&&(r.right>cw+1||r.left<-1)&&!clipped(e))bad.push(((e.id?'#'+e.id:'')+'.'+String(e.className&&e.className.baseVal!==undefined?e.className.baseVal:e.className).split(' ')[0]+'<'+e.tagName.toLowerCase()+'> L'+Math.round(r.left)+' R'+Math.round(r.right)));});
          return {cw,sw,H:document.documentElement.scrollHeight,bad:[...new Set(bad)].slice(0,30)};};
          (async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const go=async(name,url,w,h,ls,full)=>{const pg=await b.newPage();const errs=[];pg.on('pageerror',e=>errs.push(e.message.slice(0,120)));await pg.setViewport({width:w,height:h,deviceScaleFactor:1});
          await pg.evaluateOnNewDocument(ls=>{for(const k in ls)localStorage.setItem(k,ls[k]);},ls);
          try{await pg.goto(url,{waitUntil:'domcontentloaded',timeout:60000});}catch(e){errs.push('goto '+e.message);}await W(url.endsWith('/')?16000:7000);
          for(let y=0;y<16000;y+=700){await pg.evaluate(y=>scrollTo(0,y),y);await W(120);}await pg.evaluate(()=>scrollTo(0,0));await W(800);
          const info=await pg.evaluate(chk);fs.appendFileSync('info.txt',name+' '+w+': '+JSON.stringify(info)+' errs='+JSON.stringify(errs)+'\n');
          if(full)await pg.screenshot({path:`${name}-${w}.png`,fullPage:true});else await pg.screenshot({path:`${name}-${w}.png`});await pg.close();};
          const L={nbi_th:'dark',nbi_zone:'นนทบุรี/บางใหญ่',nbi_zp_seen:'1',nbi_mode:'easy'};
          for(const [w,h] of [[1024,768],[1440,900],[1920,1080]]) await go('ez',S+'/',w,h,L,false);
          await go('ezl',S+'/',1366,768,{...L,nbi_th:'light',nbi_zone:'กรุงเทพมหานคร/ป้อมปราบศัตรูพ่าย'},false);
          await b.close();})();
          JS
          node t.js 2> err.txt || true
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
