name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');(async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const pg=await b.newPage();await pg.setViewport({width:390,height:900});
          const errs=[];pg.on('pageerror',e=>errs.push(e.message));
          await pg.goto('https://checknam.com/',{waitUntil:'domcontentloaded',timeout:60000});await new Promise(r=>setTimeout(r,4000));
          const r=await pg.evaluate(async()=>{const o={};
            for(const u of ['/api/rainall','/api/zv?days=1','/api/zv?days=all','/api/tw/waterlevel_graph?station_type=tele_waterlevel&station_id=26&start_date=2026-09-30&end_date=2026-10-06','/api/tw/rain_24h_graph?station_id=26','/api/snap']){try{const g=await fetch(u);const tx=await g.text();let n=null;try{const j=JSON.parse(tx);n=j.d?j.d.length:j.top?j.top.length:j.data?(j.data.graph_data||j.data).length:null}catch(e){}o[u]={s:g.status,c:g.headers.get('x-cache'),len:tx.length,n,b:tx.slice(0,200)};}catch(e){o[u]={err:String(e)}}}
            return o;});
          await pg.setViewport({width:1280,height:900}); await pg.goto('https://checknam.com/z/862',{waitUntil:'domcontentloaded',timeout:60000}); await new Promise(r=>setTimeout(r,15000));
          r.map=await pg.evaluate(()=>{ try{ MAP.setView([13.5,101],6); }catch(e){} return {rainall: typeof RAINALL!=='undefined'&&RAINALL?RAINALL.length:null, summary: document.getElementById('alert').innerText.match(/ชั่วโมงที่ผ่านมา[^\n]*/)?.[0]}; });
          await new Promise(r=>setTimeout(r,3000)); const m=await pg.$('#map'); if(m) await m.screenshot({path:'map.png'});
          r.errs=errs;
          require('fs').writeFileSync('out.json',JSON.stringify(r,null,1));await b.close();})();
          JS
          node t.js || echo fail > out.json
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
