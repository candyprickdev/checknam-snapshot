name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d; cd d; B=https://checknam.com
          for u in /p/1 /p/2 /p/40 /chaophraya /z/1 /z/500; do echo "== $u $(curl -s -o /dev/null -w '%{http_code}' $B$u)" >> chk.txt; curl -s $B$u | grep -oE '<h1[^>]*>[^<]*</h1>|<p class="lead">[^<]{0,220}|<li><a href="/z/[0-9]+">[^<]*</a><span class="lv">.{0,170}|<li><span><b>[^<]*</b>.{0,200}|<div><span>[^<]*</span><b>[^<]*</b>|"FAQPage".{0,250}|og:title" content="[^"]*' | head -9 >> chk.txt; done
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
