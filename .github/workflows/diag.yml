name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq fonts-thai-tlwg >/dev/null 2>&1 || true
          mkdir d; cd d
          curl -s -m 30 -A 'checknam.com (+https://checknam.com)' 'https://api-v3.thaiwater.net/api/v1/thaiwater30/public/warning' > warning.json || true
          npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');const fs=require('fs');const W=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const j=JSON.parse(fs.readFileSync('warning.json','utf8'));const zs=[];for(const x of j.data.slice(0,3))for(const l of x.message.split(/\n+/)){const am=(/อ\.\s?(\S+)/.exec(l)||[])[1],pv=(/จ\.\s?(\S+)/.exec(l)||[])[1];if(am&&pv)zs.push(pv+'/'+am);}
          fs.writeFileSync('zs.txt',zs.join('\n'));
          {const pg=await b.newPage();await pg.setViewport({width:430,height:900});
          await pg.evaluateOnNewDocument(()=>{localStorage.setItem('nbi_mode','full');localStorage.setItem('nbi_zone','ปราจีนบุรี/บ้านสร้าง');});
          await pg.goto('https://stage.checknam.pages.dev/',{waitUntil:'domcontentloaded'});await W(22000);
          const r=await pg.evaluate(()=>{const [,la,lo]=PLACES[place];const kmd=(a,b,c,d)=>Math.hypot((a-c)*111,(b-d)*108);const out={la,lo,riv:[]};RIVER_GEO.forEach((r,ri)=>{if(r.h)return;let md=1e9,ml=-1;r.l.forEach((l,li)=>{for(const p of l){const d=kmd(p[0],p[1],la,lo);if(d<md){md=d;ml=li;}}});if(md<8){const P=RBK&&RBK.get(ri);if(0)out.riv.push({n:r.n,ri,md:+md.toFixed(2),ml,nl:r.l.length,lens:r.l.map(l=>l.length).slice(0,8),grp:RGROUP[r.n],s:r.s,lines:P&&P.lines?P.lines.map(L=>L.sp.map(q=>[q.i,q.d.station.tele_station_name.th,+q.d.storage_percent])):null});}});
          out.bs=['สะพานณรงค์ดำริ','บางน้ำเปรี้ยว','บ้านท่าไผ่ป่า'].map(n=>{const d=DATA.find(x=>x.station.tele_station_name.th===n);return d?{n,river:d.river_name,id:d.station.id,ok:lineOk(d),v:validPct(d)}:n;});try{const t1=performance.now();colorZones();out.tcz=performance.now()-t1;out.z2=['นนทบุรี/บางใหญ่','กรุงเทพมหานคร/บางรัก','ปราจีนบุรี/บ้านสร้าง','ปราจีนบุรี/ศรีมหาโพธิ','ฉะเชิงเทรา/บางคล้า','สุราษฎร์ธานี/พุนพิน'].map(k=>[k,ZINFO[k]&&ZINFO[k].t]);const rc=riskCore();out.rc={L:rc.L.name,how:rc.nearHow,near:rc.near.map(d=>[nm(d),+d.storage_percent,+km(d).toFixed(1)])};out.alert=document.getElementById('alert').innerText.slice(0,600);out.rbr=riverBracket(la,lo);out.rbr=out.rbr&&{river:out.rbr.river,a:nm(out.rbr.a),b:nm(out.rbr.b)};}catch(e){out.err=String(e);}return out;});
          fs.writeFileSync('bs.json',JSON.stringify(r,null,1));await pg.close();}
          await b.close();})();

          JS
          node t.js 2> err.txt || true
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
