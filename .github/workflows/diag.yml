name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');(async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const pg=await b.newPage(); const errs=[]; pg.on('pageerror',e=>errs.push(e.message));
          await pg.setViewport({width:1280,height:900}); await pg.goto('https://stage.checknam.pages.dev/z/1',{waitUntil:'domcontentloaded',timeout:60000}); await new Promise(r=>setTimeout(r,30000));
          const r=await pg.evaluate(async()=>{ const got=[]; navigator.clipboard.writeText=t=>{got.push(t);return Promise.resolve();};
            const out={share:shareInfo(), sum:SUMTEXT, lede:LEDE_TXT};
            for (const sel of ['#nbiCards > .card .cpy','#s-cp .cpy','#s-rain .cpy','#s-road .cpy']){ const b=document.querySelector(sel); if(b){ b.click(); await new Promise(r=>setTimeout(r,300)); } }
            out.copies=got; return out; });
          require('fs').writeFileSync('out.txt', JSON.stringify(r,null,1)+"\n"+JSON.stringify(errs)); await b.close();})();
          JS
          node t.js 2> err.txt || true
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
