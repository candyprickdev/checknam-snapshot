name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');(async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const pg=await b.newPage(); const errs=[]; pg.on('pageerror',e=>errs.push(e.message));
          await pg.setViewport({width:1280,height:900}); await pg.goto('https://stage.checknam.pages.dev/z/1',{waitUntil:'domcontentloaded',timeout:60000}); await new Promise(r=>setTimeout(r,30000));
          await pg.evaluate(()=>document.querySelector('#map').scrollIntoView()); await new Promise(r=>setTimeout(r,8000));
          await pg.evaluate(()=>document.querySelector('#s-radar,#rmap')?.scrollIntoView()); await new Promise(r=>setTimeout(r,8000));
          const r=await pg.evaluate(async()=>{ const got=[]; navigator.clipboard.writeText=t=>{got.push(t);return Promise.resolve();};
            const out={share:shareInfo(), sum:SUMTEXT, lede:LEDE_TXT, n:document.querySelectorAll('.cpy').length};
            for (const b of document.querySelectorAll('.cpy')){ b.click(); await new Promise(r=>setTimeout(r,150)); }
            out.copies=got; sharePop(true); out.pop=[...document.querySelectorAll('#sharePop a')].map(a=>a.getAttribute('aria-label')+' '+decodeURIComponent(a.href).slice(0,260));
            const b64=async bl=>{ const buf=new Uint8Array(await bl.arrayBuffer()); let s=''; for (let i=0;i<buf.length;i+=8192) s+=String.fromCharCode(...buf.subarray(i,i+8192)); return btoa(s); };
            try{ out.map=await b64(await mapSnap()); }catch(e){ out.mapErr=String(e); }
            try{ if(typeof rvInit==='function' && !RMAP) rvInit(); await new Promise(r=>setTimeout(r,4000)); out.radar=await b64(await rvSnap()); }catch(e){ out.radarErr=String(e); }
            return out; });
          for (const k of ['map','radar']) if (r[k]) { require('fs').writeFileSync(k+'.png', Buffer.from(r[k],'base64')); delete r[k]; }
          require('fs').writeFileSync('out.txt', JSON.stringify(r,null,1)+"\n"+JSON.stringify(errs)); await b.close();})();
          JS
          node t.js 2> err.txt || true
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
