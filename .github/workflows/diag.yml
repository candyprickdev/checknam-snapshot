name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');(async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const pg=await b.newPage();await pg.setViewport({width:390,height:900});
          const errs=[];pg.on('pageerror',e=>errs.push(e.message));
          await pg.goto('https://checknam.com/',{waitUntil:'domcontentloaded',timeout:60000});await new Promise(r=>setTimeout(r,4000));
          const r=await pg.evaluate(async()=>{const o={};
            const T=async(u)=>{const t0=Date.now();try{const g=await fetch(u);const tx=await g.text();return {s:g.status,ms:Date.now()-t0,c:g.headers.get('x-cache'),b:tx.slice(0,260)};}catch(e){return {err:String(e)}}};
            for(const u of ['/api/zv?days=1','/api/snap','/api/tw/rain_24h_graph?station_id=26','/api/tw/waterlevel_graph?station_type=tele_waterlevel&station_id=26&start_date=2026-09-29&end_date=2026-10-06','/zb/862.json','/og/862.jpg','/version.json']) o[u]=await T(u);
            return o;});
          await pg.goto('https://checknam.com/z/862',{waitUntil:'domcontentloaded',timeout:60000});await new Promise(r=>setTimeout(r,20000));
          r.z862=await pg.evaluate(()=>({zone:document.getElementById('hZone')?.textContent, alert:document.getElementById('alert')?.innerText.slice(0,600), rain:document.getElementById('rainBox')?.innerText.slice(0,500), up:document.getElementById('upBox')?.innerText.slice(0,200), opts:document.getElementById('place')?.options.length}));
          r.errs=errs;
          await pg.screenshot({path:'z862.png'});
          require('fs').writeFileSync('out.json',JSON.stringify(r,null,1));await b.close();})();
          JS
          node t.js || echo fail > out.json
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
