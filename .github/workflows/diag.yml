name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq fonts-thai-tlwg >/dev/null 2>&1 || true
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');
          (async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const pg=await b.newPage();await pg.setViewport({width:900,height:520,deviceScaleFactor:2});
          const fams=['Anuphan','IBM Plex Sans Thai','Noto Sans Thai','Prompt','Kanit','Sarabun'];
          await pg.setContent(`<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@700&family=IBM+Plex+Sans+Thai:wght@700&family=Noto+Sans+Thai:wght@700&family=Prompt:wght@600&family=Kanit:wght@600&family=Sarabun:wght@700&display=block" rel="stylesheet"><body style="margin:0;padding:10px 20px;background:#1c1f22;color:#fff">${fams.map(f=>`<div style="display:flex;align-items:baseline;gap:18px;height:80px"><span style="font:700 52px '${f}';white-space:nowrap">บางใหญ่ บ้านไผ่ ปากเกร็ด</span><small style="font:14px sans-serif;color:#9ab">${f}</small></div>`).join('')}</body>`,{waitUntil:'networkidle0'});
          await pg.evaluate(()=>document.fonts.ready);await pg.screenshot({path:'fonts.png'});await b.close();})();
          JS
          node t.js 2> err.txt || true
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
