name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');const S='https://stage.checknam.pages.dev';
          (async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const out={};
          async function run(name,z,vp,pre,act){const cx=await b.createBrowserContext();const pg=await cx.newPage();const errs=[];pg.on('pageerror',e=>errs.push(e.message));await pg.setViewport(vp);
            if(pre) await pg.evaluateOnNewDocument(pre);
            await pg.goto(S+'/z/'+z,{waitUntil:'domcontentloaded',timeout:60000});await new Promise(r=>setTimeout(r,25000));
            if(act) await act(pg);
            await pg.screenshot({path:name+'.png',fullPage:true});
            out[name]={errs,info:await pg.evaluate(()=>({mode:document.documentElement.dataset.mode,lv:document.querySelector('#easy .ez-lv')?.innerText,say:document.querySelector('#easy .ez-say')?.innerText,tiles:[...document.querySelectorAll('#easy .ez-ti')].map(x=>x.innerText.replace(/\n/g,' | ')),alert:document.querySelector('#alert .lede')?.innerText?.slice(0,200),mapW:document.querySelector('#map')?.clientWidth}))};await cx.close();}
          const M={width:390,height:844,deviceScaleFactor:2};
          const sh=async(pg,n)=>{await new Promise(r=>setTimeout(r,15000));
            for(const [sel,f] of [['.ez-b',n+'_btn'],['#easy2 .ez-box:nth-child(2)',n+'_hist']]){const el=await pg.$(sel);if(el){await el.scrollIntoView();await new Promise(r=>setTimeout(r,800));await el.screenshot({path:f+'.png'});}}
            out[n+'_fh']=await pg.evaluate(()=>{const k=fhKey();return {fh:FH[k],now:FHN[k]}});};
          for(const [n,name,th] of [['d','นนทบุรี/บางใหญ่','dark'],['l','นนทบุรี/บางบัวทอง','light'],]){
            const cx=await b.createBrowserContext();const pg=await cx.newPage();await pg.setViewport({width:390,height:844,deviceScaleFactor:2});
            await pg.evaluateOnNewDocument(t=>{localStorage.setItem('nbi_th',t)},th);
            await pg.goto(S+'/z/1',{waitUntil:'domcontentloaded',timeout:60000});await pg.waitForFunction(()=>typeof ZKEYS!=='undefined');
            const z=await pg.evaluate(n=>ZKEYS.indexOf(n)+1,name);await pg.goto(S+'/z/'+z,{waitUntil:'domcontentloaded',timeout:60000});
            await new Promise(r=>setTimeout(r,20000));await pg.evaluate(()=>document.querySelector('#easy2').scrollIntoView());
            await sh(pg,n);await cx.close();}
          require('fs').writeFileSync('out.json',JSON.stringify(out,null,1));await b.close();})();
          JS
          node t.js 2> err.txt || true
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
