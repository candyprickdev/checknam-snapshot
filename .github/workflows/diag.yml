name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq fonts-thai-tlwg >/dev/null 2>&1 || true
          mkdir d; cd d
          UA='checknam.com (+https://checknam.com)'
          curl -s -m 30 -A "$UA" https://www.thaiwater.net/ > tw.html || true
          for js in $(grep -oE 'src="[^"]+\.js"' tw.html | sed 's/src="//;s/"$//' | head -20); do case $js in http*) u=$js;; *) u=https://www.thaiwater.net/${js#/};; esac; curl -s -m 60 -A "$UA" "$u" >> all.js || true; done
          grep -oE '"[a-z_/]*(graph|yearly|compare|history|max)[a-z_/]*"' all.js | sort | uniq -c | sort -rn | head -80 > ep.txt || true
          grep -oE 'public/[a-zA-Z_/]+' all.js | sort | uniq -c | sort -rn | head -120 >> ep.txt || true
          ls -la >> ep.txt; rm -f all.js
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
