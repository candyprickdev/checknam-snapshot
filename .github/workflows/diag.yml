name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq osmium-tool >/dev/null
          mkdir d; cd d
          curl -sSL -o th.pbf https://download.geofabrik.de/asia/thailand-latest.osm.pbf
          osmium tags-filter th.pbf w/waterway=river,stream,canal,drain,ditch -o ww.pbf
          osmium export ww.pbf -f geojsonseq -o ww.geojsonseq --geometry-types=linestring
          : > hr.geojsonseq  # HydroRIVERS ดาวน์โหลดอัตโนมัติไม่ได้ (เว็บต้นทางให้ยืนยันตัวตนผ่านเบราว์เซอร์) รอบนี้ใช้ OpenStreetMap อย่างเดียว
          wc -l ww.geojsonseq hr.geojsonseq
          npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');(async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const pg=await b.newPage(); await pg.goto('https://checknam.com/z/1',{waitUntil:'domcontentloaded',timeout:60000}); await new Promise(r=>setTimeout(r,35000));
          const st=await pg.evaluate(()=>DATA.filter(d=>+d.station.tele_station_lat).map(d=>({id:d.station.id,rn:d.river_name||'',la:+d.station.tele_station_lat,lo:+d.station.tele_station_long})));
          const src=await pg.evaluate(()=>document.querySelector('script[src*="rivers-"]').src);
          require('fs').writeFileSync('ST.json',JSON.stringify(st)); require('fs').writeFileSync('src.txt',src); await b.close();})();
          JS
          node t.js
          curl -sSL -o OLD.js "$(cat src.txt)"; cat src.txt
          python3 ../addrivers2.py ww.geojsonseq hr.geojsonseq ST.json OLD.js NEW2.json | tee log.txt
          mkdir -p out && cp NEW2.json log.txt src.txt out/ && cd out
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
