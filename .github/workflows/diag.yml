name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq fonts-thai-tlwg >/dev/null 2>&1 || true
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');const S='https://checknam.com';
          const RAIN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14.5a4.5 4.5 0 1 1 .9-8.9A5.5 5.5 0 0 1 18.5 7.5 3.5 3.5 0 0 1 17.5 14.5"/><path d="M9 17.5l-1 3M13 17.5l-1 3M17 17.5l-1 3"/></svg>';
          const CH='<svg class="ch" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';
          const CSS=`
          .tw{margin:4px 0 16px}
          .tw .sc{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:0 16px}.tw .sc::-webkit-scrollbar{display:none}
          .tw .cd{--sv:#c25400;--svi:#b34a00;flex:0 0 100%;scroll-snap-align:center;box-sizing:border-box;padding:14px 16px 12px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
          .tw.n2 .cd{flex-basis:calc(100% - 22px)}
          .tw .cd.x{--sv:#d70015;--svi:#c00013}
          :root[data-theme=dark] .tw .cd,:root[data-theme=dim] .tw .cd{--svi:#ff9a4d}:root[data-theme=dark] .tw .cd.x{--svi:#ff6b6b}
          .tw .top{display:flex;align-items:center;gap:11px}.tw .ic{width:36px;height:36px;border-radius:10px;background:var(--sv);color:#fff;display:grid;place-items:center;flex:none}.tw .ic svg{width:21px;height:21px}
          .tw .hd{flex:1;min-width:0}.tw .k{display:block;font-size:.74rem;color:var(--muted)}.tw .t{display:block;font-size:1.08rem;font-weight:700;color:var(--ink);line-height:1.3}
          .tw .ch{width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2;flex:none}.tw .cd.o .ch{transform:rotate(180deg)}
          .tw .tl{margin:13px 2px 0;position:relative;height:6px;border-radius:3px;background:color-mix(in srgb,var(--sv) 16%,transparent)}
          .tw .tl i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,color-mix(in srgb,var(--sv) 40%,transparent),var(--sv))}
          .tw .tl em{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--panel);border:3px solid var(--sv);box-sizing:border-box}
          .tw .lb{display:flex;justify-content:space-between;margin-top:7px;font-size:.74rem;color:var(--muted)}.tw .lb b{color:var(--svi);font-weight:600}
          .tw .bd{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:.88rem;line-height:1.65;color:var(--ink)}.tw .bd p{margin:0 0 8px}.tw .bd .m{font-size:.76rem;color:var(--muted);margin:0}.tw .bd a{color:var(--river)}
          .tw .dt{display:flex;justify-content:center;gap:6px;margin-top:9px}.tw .dt i{width:6px;height:6px;border-radius:3px;background:var(--line)}.tw .dt i.on{width:18px;background:var(--muted)}`;
          const card=(x,title,area,f,start,end,left,open)=>`<div class="cd${x?" x":""}${open?" o":""}"><div class="top"><span class="ic">${RAIN}</span><div class="hd"><span class="k">ประกาศกรมอุตุนิยมวิทยา · ${area}</span><span class="t">${title}</span></div>${CH}</div><div class="tl"><i style="width:${f*100}%"></i><em style="left:${f*100}%"></em></div><div class="lb"><span>ออกประกาศ ${start}</span><b>ตอนนี้ · อีก ${left}</b><span>สิ้นสุด ${end}</span></div>${open?`<div class="bd"><p>ขอให้ประชาชนระวังอันตรายจากฝนตกหนักถึงหนักมากและฝนที่ตกสะสม ซึ่งอาจทำให้เกิดน้ำท่วมฉับพลันและน้ำป่าไหลหลาก โดยเฉพาะริมทางน้ำใกล้เชิงเขาและที่ลุ่ม</p><p class="m">ครอบคลุม กรุงเทพฯ นนทบุรี ปทุมธานี สมุทรปราการ อยุธยา และอีก 9 จังหวัด · ออกประกาศ 05:40 น. วันนี้ มีผล 06:00–18:00 น. · <a href="#">ดูประกาศต้นฉบับ</a></p></div>`:""}</div>`;
          const ONE=`<div class="tw"><div class="sc">${card(0,"ฝนตกหนัก","พื้นที่ของคุณอยู่ในเขตเตือน",0.36,"05:40","18:00","8 ชม.",0)}</div></div>`;
          const TWO=`<div class="tw n2"><div class="sc">${card(1,"ฝนตกหนักมาก","พื้นที่ของคุณอยู่ในเขตเตือน",0.36,"05:55","18:00","8 ชม.",0)}${card(0,"ฝนตกหนัก","พื้นที่ของคุณอยู่ในเขตเตือน",0.36,"05:40","18:00","8 ชม.",0)}</div><div class="dt"><i class="on"></i><i></i></div></div>`;
          const OPEN=`<div class="tw"><div class="sc">${card(0,"ฝนตกหนัก","พื้นที่ของคุณอยู่ในเขตเตือน",0.36,"05:40","18:00","8 ชม.",1)}</div></div>`;
          (async()=>{const out={};
          for (const [n,th,H] of [['f1','light',ONE],['f2','light',TWO],['f3','light',OPEN],['f4','dark',TWO]]){const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const pg=await b.newPage();await pg.setViewport({width:390,height:844,deviceScaleFactor:2});
          await pg.evaluateOnNewDocument(new Function(`localStorage.setItem('nbi_mode','easy');localStorage.setItem('nbi_th','${th}');localStorage.setItem('nbi_zone','นนทบุรี/บางใหญ่');`));
          await pg.goto(S+'/',{waitUntil:'domcontentloaded',timeout:60000});await new Promise(r=>setTimeout(r,22000));
          out[n]=await pg.evaluate((CSS,H)=>{const st=document.createElement('style');st.textContent=CSS;document.head.appendChild(st);const x=document.querySelector('#easy .ez-x');x.insertAdjacentHTML('beforebegin',H);const b=document.getElementById('ezBar');if(b)b.remove();scrollTo(0,0);return true},CSS,H);
          await new Promise(r=>setTimeout(r,900));await pg.screenshot({path:n+'.png',clip:{x:0,y:180,width:390,height:600}});await b.close();}
          require('fs').writeFileSync('out.json',JSON.stringify(out));})();
          JS
          node t.js 2> err.txt || true
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
