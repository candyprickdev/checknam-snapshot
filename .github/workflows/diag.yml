name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d; cd d
          echo "key file: $(curl -s https://checknam.com/c59fb8f9e4ed0fafa322718490ccfea2.txt)" >> out.txt
          curl -s https://checknam.com/sitemap.xml | grep -oE '<loc>[^<]+' | sed 's/<loc>//' > urls.txt; echo "urls: $(wc -l < urls.txt)" >> out.txt
          python3 -c "import json;u=[l.strip() for l in open('urls.txt') if l.strip()];json.dump({'host':'checknam.com','key':'c59fb8f9e4ed0fafa322718490ccfea2','keyLocation':'https://checknam.com/c59fb8f9e4ed0fafa322718490ccfea2.txt','urlList':u},open('b.json','w'))"
          echo "indexnow: $(curl -s -o r.txt -w '%{http_code}' -X POST -H 'Content-Type: application/json; charset=utf-8' --data @b.json https://api.indexnow.org/indexnow) $(head -c 300 r.txt)" >> out.txt
          rm -f b.json urls.txt r.txt
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
