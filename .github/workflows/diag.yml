name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d; cd d
          curl -s -m 60 "https://data.humdata.org/api/3/action/package_show?id=cod-ab-tha" -o hdx.json; ls -la hdx.json
          python3 - <<'PY'
          import json
          j=json.load(open('hdx.json'))['result']
          print(j.get('license_title'), j.get('dataset_source'), j.get('last_modified'))
          for r in j['resources']: print(r['name'], r.get('format'), r.get('size'), r['url'])
          PY
          python3 - > res.txt <<'PY'
          import json
          j=json.load(open('hdx.json'))['result']
          print('LICENSE', j.get('license_title'), '|', j.get('license_other') or '', '|', j.get('dataset_source'), '|', j.get('last_modified'))
          for r in j['resources']: print(r['name'], '|', r.get('format'), '|', r.get('size'), '|', r['url'])
          PY
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
