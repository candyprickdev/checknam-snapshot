name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq fonts-thai-tlwg >/dev/null 2>&1 || true
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');const S='https://stage.checknam.pages.dev';
          (async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const out={};
          for(const [n,th,z] of [['fa','dark',1],['fb','light',600],['fc','light',50],['fd','dark',200]]){
          const cx=await b.createBrowserContext();const pg=await cx.newPage();const errs=[];pg.on('pageerror',e=>errs.push(e.message));await pg.setViewport({width:390,height:844,deviceScaleFactor:2});
          await pg.evaluateOnNewDocument(t=>{localStorage.setItem('nbi_th',t)},th);
          await pg.goto(S+'/z/'+z,{waitUntil:'domcontentloaded',timeout:60000});await new Promise(r=>setTimeout(r,22000));
          await pg.evaluate(()=>scrollTo(0,0));await new Promise(r=>setTimeout(r,600));const bx=await pg.evaluate(()=>{const e=document.querySelector('#easy');if(!e)return null;const r=e.getBoundingClientRect();return {x:0,y:r.top+scrollY,width:390,height:Math.min(r.height,620)}});await pg.screenshot({path:n+'.png',clip:bx||{x:0,y:0,width:390,height:800},captureBeyondViewport:true});
          const q=await pg.$('#donate');if(q){await q.scrollIntoView();await new Promise(r=>setTimeout(r,500));await q.screenshot({path:n+'qr.png'});}out[n]={errs,fg:await pg.evaluate(()=>[...document.querySelectorAll('.ez-fg > div')].map(x=>x.innerText.replace(/\n/g,' '))),tx:await pg.evaluate(()=>{const g=s=>{const e=document.querySelector(s);return e?e.textContent.replace(/\s+/g,' ').trim().slice(0,900):null};return {now:g('#fcNow'),sum:g('#alert'),rain:g('#rainBox'),radar:g('#rdrS'),obs:typeof RV!=='undefined'?RV.obs:null}})};await cx.close();}
          require('fs').writeFileSync('out.json',JSON.stringify(out,null,1));await b.close();})();
          JS
          node t.js 2> err.txt || true
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
