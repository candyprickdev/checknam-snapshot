name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq fonts-thai-tlwg >/dev/null 2>&1 || true
          mkdir d; cd d
          curl -s -m 30 -A 'checknam.com (+https://checknam.com)' 'https://api-v3.thaiwater.net/api/v1/thaiwater30/public/warning' > warning.json || true
          npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');const fs=require('fs');const W=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const j=JSON.parse(fs.readFileSync('warning.json','utf8'));const zs=[];for(const x of j.data.slice(0,3))for(const l of x.message.split(/\n+/)){const am=(/อ\.\s?(\S+)/.exec(l)||[])[1],pv=(/จ\.\s?(\S+)/.exec(l)||[])[1];if(am&&pv)zs.push(pv+'/'+am);}
          fs.writeFileSync('zs.txt',zs.join('\n'));
          {const pg=await b.newPage();await pg.setViewport({width:430,height:900});
          await pg.evaluateOnNewDocument(()=>{localStorage.setItem('nbi_mode','full');localStorage.setItem('nbi_zone','ปราจีนบุรี/บ้านสร้าง');});
          await pg.goto('https://stage.checknam.pages.dev/',{waitUntil:'domcontentloaded'});await W(22000);
          const r=await pg.evaluate(()=>{const t0=performance.now();colorZones();const tcz=performance.now()-t0;const z2=['นนทบุรี/บางใหญ่','กรุงเทพมหานคร/บางรัก','อยุธยา/บางบาล','ปราจีนบุรี/ศรีมหาโพธิ','ฉะเชิงเทรา/บางคล้า'].map(k=>[k,ZINFO[k]&&ZINFO[k].t]);const rc=riskCore();const f=d=>({n:d.station.tele_station_name.th,river:d.river_name,p:+d.storage_percent,km:+km(d).toFixed(1),amp:d.geocode&&d.geocode.amphoe_name&&d.geocode.amphoe_name.th,old:d.station.tele_station_oldcode,t:d.waterlevel_datetime});
            return {tcz,z2,L:rc.L.name,score:rc.score,how:rc.nearHow,near:rc.near.map(f),mx:rc.mx?f(rc.mx):null,over:(rc.over||[]).slice(0,6).map(f),inR:(rc.inR||[]).filter(d=>km(d)<20).map(f),easy:document.getElementById('zLine')?.innerText,alert:document.getElementById('alert').innerText.slice(0,900)};});
          fs.writeFileSync('bs.json',JSON.stringify(r,null,1));await pg.close();}
          await b.close();})();

          JS
          node t.js 2> err.txt || true
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
