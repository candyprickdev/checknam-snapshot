name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');(async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const out={};
          for(const z of [163,162,164]){const pg=await b.newPage();await pg.setViewport({width:1280,height:900});const errs=[];pg.on('pageerror',e=>errs.push(e.message));
            await pg.goto('https://checknam.com/z/'+z,{waitUntil:'domcontentloaded',timeout:60000});await new Promise(r=>setTimeout(r,30000));
            out[z]=await pg.evaluate(()=>{const rc=riskCore();const near=(rc.inRAll||[]).map(d=>({n:d.station.tele_station_name.th,r:d.river_name,km:+km(d).toFixed(1),p:d.storage_percent,t:d.waterlevel_datetime,src:d.src||'tw',stale:isStale(d)}));
              return {L:rc.L&&rc.L.name,score:rc.score,mx:rc.mx&&rc.mx.station.tele_station_name.th,f:rc.f.map(x=>x.t+': '+x.v+' ('+x.s+') '+String(x.d||'').slice(0,160)),near,alert:document.getElementById('alert').innerText.slice(0,900),radius}});
            out[z].errs=errs; await pg.close();}
          require('fs').writeFileSync('out.json',JSON.stringify(out,null,1));await b.close();})();
          JS
          node t.js 2> err.txt || echo fail > out.json
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
