name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq fonts-thai-tlwg >/dev/null 2>&1 || true
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          npm i -s pngjs >/dev/null 2>&1
          cat > t.js <<'JS'
          const {PNG}=require('pngjs');const fs=require('fs');
          const h="";
          const P=[];for(let i=0;i<50;i++){const s=h.substr(i*6,6);P.push([parseInt(s.substr(0,2),16),parseInt(s.substr(2,2),16),parseInt(s.substr(4,2),16),15+i]);}
          const dbz=(r,g,b)=>{let best=1e9,d=0;for(const p of P){const e=(p[0]-r)**2+(p[1]-g)**2+(p[2]-b)**2;if(e<best){best=e;d=p[3];}}return [best<5000?d:0,best];};
          (async()=>{const out={now:Date.now()};
          const m=await (await fetch('https://api.rainviewer.com/public/weather-maps.json')).json();
          out.host=m.host;out.frames=(m.radar.past||[]).map(f=>[f.time,f.path]);out.nowcast=(m.radar.nowcast||[]).length;out.lagMin=Math.round((Date.now()/1000-m.radar.past.at(-1).time)/60);
          const f=m.radar.past.at(-1);const n=128;const tx=x=>Math.floor((x+180)/360*n),ty=y=>{const s=Math.sin(y*Math.PI/180);return Math.floor((0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*n)};
          // Thailand bbox
          const T=[];for(let X=tx(97);X<=tx(106);X++)for(let Y=ty(20.5);Y<=ty(5.5);Y++)T.push([X,Y]);
          const st={tiles:0,px:0,alphaLow:0,matched:0,unmatched:0,dbzHist:{},badColors:{}};
          for(const [X,Y] of T){for(const opt of ['2/1_0']){const u=`${m.host}${f.path}/256/7/${X}/${Y}/${opt}.png`;const r=await fetch(u);if(!r.ok){st['http'+r.status]=(st['http'+r.status]||0)+1;continue;}
          const png=PNG.sync.read(Buffer.from(await r.arrayBuffer()));st.tiles++;const d=png.data;
          for(let q=0;q<d.length;q+=4){if(d[q+3]===0)continue;st.px++;if(d[q+3]<200){st.alphaLow++;continue;}const [z,b]=dbz(d[q],d[q+1],d[q+2]);if(z){st.matched++;const k=Math.floor(z/5)*5;st.dbzHist[k]=(st.dbzHist[k]||0)+1;}else{st.unmatched++;const c=d[q].toString(16).padStart(2,'0')+d[q+1].toString(16).padStart(2,'0')+d[q+2].toString(16).padStart(2,'0');st.badColors[c]=(st.badColors[c]||0)+1;}}}}
          st.badColors=Object.entries(st.badColors).sort((a,b)=>b[1]-a[1]).slice(0,15);out.thailand=st;
          // coverage check: what does the "coverage" layer say for Bangkok tile
          try{const cv=m.radar&&m.host;const u=`${m.host}/v2/coverage/0/256/7/${tx(100.5)}/${ty(13.8)}/0/0_0.png`;const r=await fetch(u);out.coverage=r.status;if(r.ok){const p=PNG.sync.read(Buffer.from(await r.arrayBuffer()));let a=0;for(let q=3;q<p.data.length;q+=4)if(p.data[q])a++;out.coverageOpaque=a;}}catch(e){out.covErr=String(e)}
          fs.writeFileSync('rv.json',JSON.stringify(out,null,1));})();
          JS
          node t.js 2> err.txt || true
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
