name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq fonts-thai-tlwg >/dev/null 2>&1 || true
          mkdir d; cd d
          UA='Mozilla/5.0 (compatible; checknam.com; +https://checknam.com)'
          for u in https://www.matichon.co.th/region/feed https://www.matichon.co.th/local/feed https://www.khaosod.co.th/around-thailand/feed https://www.khaosod.co.th/breaking-news/feed https://www.prachachat.net/local-economy/feed https://www.thaipost.net/district-news/feed/ https://www.thaipost.net/x-cite-news/feed/ https://www.thaipbs.or.th/rss.xml https://news.thaipbs.or.th/rss https://www.dailynews.co.th/news/feed/ https://www.dailynews.co.th/regional/feed/ https://www.banmuang.co.th/rss https://www.banmuang.co.th/feed https://www.mcot.net/rss https://tna.mcot.net/feed https://www.springnews.co.th/feed https://www.naewna.com/rss/local.xml https://www.siamrath.co.th/rss.xml https://www.hfocus.org/rss.xml https://www.innnews.co.th/feed/ https://www.thereporters.co/feed/ https://www.chiangmainews.co.th/feed/ https://www.bangkokpost.com/rss/data/thailand.xml https://www.nationthailand.com/rss ; do n=$(echo $u | sed 's#https://##;s#[/.]#_#g'); curl -sL -m 25 -A "$UA" -o "f_$n.xml" -w "$u %{http_code} %{size_download}\n" "$u" >> w.txt || echo "$u fail" >> w.txt; done
          for f in f_*.xml; do echo "== $f $(grep -o '<item' $f | wc -l) items; $(grep -o '<pubDate>[^<]*' $f | head -1) | $(grep -o '<pubDate>[^<]*' $f | tail -1)"; done >> w.txt
          rm -f f_*.xml
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
