name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq fonts-thai-tlwg >/dev/null 2>&1 || true
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');const S='https://stage.checknam.pages.dev';
          (async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const out={};
          for(const [n,th,act] of [['cp_dark','dark',0],['cp_lv','dark',1],['cp_light','light',0]]){
          const cx=await b.createBrowserContext();const pg=await cx.newPage();const errs=[];pg.on('pageerror',e=>errs.push(e.message));
          await pg.setViewport({width:390,height:844,deviceScaleFactor:2});await pg.evaluateOnNewDocument(t=>{localStorage.setItem('nbi_th',t)},th);
          await pg.goto(S+'/chaophraya',{waitUntil:'networkidle2',timeout:60000});
          if(act){await pg.click('.seg button[data-m=lv]');await new Promise(r=>setTimeout(r,500));}
          await pg.screenshot({path:n+'.png',fullPage:true});out[n]=errs;await cx.close();}
          const cx=await b.createBrowserContext();const pg=await cx.newPage();await pg.setViewport({width:1280,height:900});await pg.goto(S+'/chaophraya',{waitUntil:'networkidle2'});await pg.screenshot({path:'cp_desk.png',fullPage:true});
          require('fs').writeFileSync('out.json',JSON.stringify(out,null,1));await b.close();})();
          JS
          node t.js 2> err.txt || true
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
