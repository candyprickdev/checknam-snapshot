name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');(async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const out={};
          const pg=await b.newPage();const errs=[];pg.on('pageerror',e=>errs.push(e.message));const tw=[];
          pg.on('response',r=>{const u=r.url();if(/api\/tw\/(waterlevel_graph|rain_24h_graph)/.test(u))tw.push([r.status(),r.headers()['x-cache'],u.split('?')[1].slice(0,90)]);});
          await pg.goto('https://checknam.com/z/163',{waitUntil:'domcontentloaded',timeout:60000});await new Promise(r=>setTimeout(r,40000));
          out.tw=tw;out.n=await pg.evaluate(()=>[DATA.length,Math.max(...DATA.map(d=>tLocal(d.waterlevel_datetime)))]);out.hc=await pg.evaluate(()=>Object.keys(HCACHE).length);out.trend=await pg.evaluate(()=>{const r=riskCore();return [r.L.name,r.avg24,r.chs.length];});
          await pg.reload({waitUntil:'domcontentloaded'});await new Promise(r=>setTimeout(r,25000));out.trend2=await pg.evaluate(()=>{const r=riskCore();return [r.L.name,r.avg24,r.chs.length];});
          out.errs=errs;require('fs').writeFileSync('out.json',JSON.stringify(out,null,1));await b.close();})();
          JS
          node t.js 2> err.txt || echo fail > out.json
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
