name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq fonts-thai-tlwg >/dev/null 2>&1 || true
          mkdir d; cd d
          npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');const fs=require('fs');const W=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const out={};
          for(const z of ['นนทบุรี/บางใหญ่','นนทบุรี/บางบัวทอง','นนทบุรี/ปากเกร็ด']){const pg=await b.newPage();
          await pg.evaluateOnNewDocument(z=>{localStorage.setItem('nbi_mode','easy');localStorage.setItem('nbi_zone',z);},z);
          await pg.goto('https://checknam.com/',{waitUntil:'domcontentloaded'});await W(45000);
          out[z]=await pg.evaluate(()=>{const rc=riskCore();return {L:rc.L.name,score:rc.score,floT:rc.floT,nearCP:rc.nearCP,dCP:rc.dCP,tide:TIDE_NEXT&&{t:new Date(TIDE_NEXT.t).toISOString(),est:TIDE_NEXT.est,bank:TIDE_NEXT.bank},ups:(rc.ups||[]).map(u=>nm(u.d)+' '+u.d.storage_percent+' '+u.river+' '+u.along.toFixed(0)+'km'),f:rc.f.map(x=>x.t+': '+x.v+' ['+x.s+'] '+String(x.d).replace(/<[^>]+>/g,'').slice(0,260))};});await pg.close();}
          fs.writeFileSync('st.json',JSON.stringify(out,null,1));await b.close();})();
          JS
          node t.js 2> err.txt || true
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
