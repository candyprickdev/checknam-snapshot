name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');(async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const pg=await b.newPage();
          await pg.setViewport({width:390,height:844,deviceScaleFactor:2,isMobile:true,hasTouch:true});
          await pg.goto('https://checknam.com/z/862',{waitUntil:'domcontentloaded',timeout:60000});await new Promise(r=>setTimeout(r,25000));
          const info=await pg.evaluate(()=>{const b=document.getElementById('rainBox');b.scrollIntoView();return {txt:b.innerText.slice(0,600),rainH:document.getElementById('rainH')?.innerText.slice(0,300),tabs:[...document.querySelectorAll('nav a,nav button')].map(e=>e.innerText.trim()+'>'+(e.getAttribute('href')||e.dataset.t||'')).slice(0,14)}});
          await new Promise(r=>setTimeout(r,1500));
          const el=await pg.$('#rainBox'); await (await el.evaluateHandle(e=>e.closest('.panel'))).screenshot({path:'rain.png'});
          require('fs').writeFileSync('out.json',JSON.stringify(info,null,1));await b.close();})();
          JS
          node t.js || echo fail > out.json
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
