name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');(async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const out={};
          const pg=await b.newPage(); await pg.setViewport({width:1000,height:800}); const errs=[];pg.on('pageerror',e=>errs.push(e.message));
          await pg.goto('https://stage.checknam.pages.dev/z/1',{waitUntil:'domcontentloaded',timeout:60000}); await new Promise(r=>setTimeout(r,30000)); { const m=await pg.$('#map'); await m.scrollIntoView(); await new Promise(r=>setTimeout(r,8000)); }
          out.r=await pg.evaluate(async()=>{ document.querySelector('#tFlow').checked=true; MAP.setZoom(13); drawFlow(); FLOW.addLayer(FLOWM); await new Promise(r=>setTimeout(r,500));
            const segs=[]; const walk=g=>g.eachLayer(l=>{ if(l.eachLayer) return walk(l); if(!(l instanceof L.Polyline)||!l.getTooltip||!l.getTooltip()) return; const ll=l.getLatLngs(); const arr=Array.isArray(ll[0])?ll:[ll]; for(const line of arr) for(let i=1;i<line.length;i++) segs.push([line[i-1],line[i],l.options.color,String(l.getTooltip().getContent()).replace(/<[^>]+>/g," ").slice(0,110)]); });
            walk(FLOW); walk(FLOWM);
            const res=[]; for(const d of DATA){ const n=nm(d); if(!/สระตาแวว|ห้วยแก้ว|สร่างโศก|บ่อดินขาว|เขาวง|มโนรมย์|ทุ่งซ้ายคลองชัยนาท/.test(n)) continue; const la=+d.station.tele_station_lat, lo=+d.station.tele_station_long; const near=[];
              for(const [a,b,c,t] of segs){ if(Math.min(a.lat,b.lat)-la>.03||la-Math.max(a.lat,b.lat)>.03||Math.min(a.lng,b.lng)-lo>.03||lo-Math.max(a.lng,b.lng)>.03) continue; const ax=(a.lng-lo)*108, ay=(a.lat-la)*111, bx=(b.lng-lo)*108, by=(b.lat-la)*111, vx=bx-ax, vy=by-ay, L2=vx*vx+vy*vy; let u=L2?-(ax*vx+ay*vy)/L2:0; u=u<0?0:u>1?1:u; const dd=Math.hypot(ax+vx*u,ay+vy*u); if(dd<=0.5) near.push([+dd.toFixed(2),c,t]); }
              near.sort((x,y)=>x[0]-y[0]); const seen=new Set(); res.push({id:String(d.station.id),n,rv:d.river_name,p:d.storage_percent,lv:mapLv(d),ok:lineOk(d),la,lo,sl:stationLines(d).map(ri=>RIVER_GEO[ri].n),note:lineNote(d).replace(/<br>/g,""),near:near.filter(x=>{const k=x[1]+x[2]; if(seen.has(k)) return false; seen.add(k); return true;}).slice(0,6)}); }
            return res; });
          for (const [i,s] of out.r.entries()){ await pg.evaluate(s=>MAP.setView([s.la,s.lo],14,{animate:false}),s); await new Promise(r=>setTimeout(r,3500)); const m=await pg.$('#map'); await m.screenshot({path:'s'+i+'.png'}); }
          out.errs=errs; require('fs').writeFileSync('out.json',JSON.stringify(out,null,1)); await b.close();})();
          JS
          node t.js 2> err.txt || true
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
