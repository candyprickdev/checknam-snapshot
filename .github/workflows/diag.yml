name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq fonts-thai-tlwg >/dev/null 2>&1 || true
          mkdir d; cd d
          curl -s -m 30 -A 'checknam.com (+https://checknam.com)' 'https://api-v3.thaiwater.net/api/v1/thaiwater30/public/warning' > warning.json || true
          npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');const fs=require('fs');const W=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const j=JSON.parse(fs.readFileSync('warning.json','utf8'));const zs=[];for(const x of j.data.slice(0,3))for(const l of x.message.split(/\n+/)){const am=(/อ\.\s?(\S+)/.exec(l)||[])[1],pv=(/จ\.\s?(\S+)/.exec(l)||[])[1];if(am&&pv)zs.push(pv+'/'+am);}
          fs.writeFileSync('zs.txt',zs.join('\n'));
          for(const [L,th,w] of [[1,'dark',430],[3,'light',430],[4,'dark',1440]]){const pg=await b.newPage();const errs=[];pg.on('pageerror',e=>errs.push(e.message));await pg.setViewport({width:w,height:900,deviceScaleFactor:2});
          await pg.evaluateOnNewDocument(t=>{localStorage.setItem('nbi_mode','easy');localStorage.setItem('nbi_th',t);localStorage.setItem('nbi_zone','นนทบุรี/บางใหญ่');},th);
          await pg.goto('https://stage.checknam.pages.dev/',{waitUntil:'domcontentloaded'});await W(15000);
          await pg.evaluate(L=>{const x=document.querySelector('#easy .ez-x');x.scrollIntoView();scrollBy(0,-40);let c=x.querySelector('canvas.ez-rn');if(!c){c=document.createElement('canvas');c.className='ez-rn';x.appendChild(c);}c.dataset.l=L;c.dataset.n=[5,22,34,52,68][L];c.dataset.dir=1;c.dataset.ws=12;if(RN){RN.stop();RN=null;}rainInit();},L);
          await W(1500);const el=await pg.$('#easy .ez-x');
          for(let i=0;i<10;i++){await el.screenshot({path:`r${L}-${String(i).padStart(2,'0')}.png`});await W(60);}
          fs.appendFileSync('sw.txt',L+' '+JSON.stringify(errs)+'\n');await pg.close();}
          await b.close();})();

          JS
          node t.js 2> err.txt || true
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
