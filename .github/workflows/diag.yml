name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');(async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const out={};
          const scan=()=>{const c={},z={};for(const k of Object.keys(PLACES)){const r=zoneRisk(k);if(!r)continue;const n=r.noWL?'na':r.L.name;c[n]=(c[n]||0)+1;z[k]=n;}return {c,z};};
          for (const [nm,host] of [['stage','https://stage.checknam.pages.dev'],['prod','https://checknam.com']]){ const pg=await b.newPage();await pg.setViewport({width:1280,height:900,deviceScaleFactor:1});const errs=[];pg.on('pageerror',e=>errs.push(e.message));
            await pg.goto(host+'/z/1',{waitUntil:'domcontentloaded',timeout:60000});await new Promise(r=>setTimeout(r,45000));
            out[nm]={errs,scan:await pg.evaluate(scan)};
            if(nm==='stage'){ out.stage.dots=await pg.evaluate(()=>{const a=[];for(const d of DATA){const lv=mapLv(d);if(validPct(d)&&lv!==lvOfPct(+d.storage_percent))a.push([nm(d),(+d.storage_percent).toFixed(0),lv]);}return a;});
              const m=await pg.$('#s-map'); if(m){ await m.scrollIntoView(); await new Promise(r=>setTimeout(r,4000)); await m.screenshot({path:'map.png'}); } }
            await pg.close(); }
          const ch=[]; for(const k in out.stage.scan.z){ if(out.prod.scan.z[k]!==out.stage.scan.z[k]) ch.push(k+': '+out.prod.scan.z[k]+' -> '+out.stage.scan.z[k]); } out.changes=ch; delete out.stage.scan.z; delete out.prod.scan.z;
          require('fs').writeFileSync('out.json',JSON.stringify(out,null,1));await b.close();})();
          JS
          node t.js 2> err.txt || echo fail > out.json
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
