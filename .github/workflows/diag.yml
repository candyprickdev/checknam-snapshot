name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d; cd d
          for n in 1 2 100 500 650 927; do curl -s -A "facebookexternalhit/1.1" "https://checknam.com/z/$n?s=0320" | grep -oE '<meta property="og:(title|description|image)" content="[^"]*"' >> og.txt; echo "--" >> og.txt; done
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
