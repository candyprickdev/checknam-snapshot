name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');(async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const out={};
          const pg=await b.newPage();await pg.setViewport({width:390,height:844});const errs=[];pg.on('pageerror',e=>errs.push(e.message));
          await pg.goto('https://checknam.com/z/163',{waitUntil:'domcontentloaded',timeout:60000});await new Promise(r=>setTimeout(r,35000));
          const ids=await pg.evaluate(()=>{const K=Object.keys(PLACES);const f=n=>K.findIndex(k=>PLACES[k][0]===n)+1;return {bangyai:f('บางใหญ่'),maewong:f('แม่วงก์'),bangkhla:f('บางคล้า'),maechan:f('แม่จัน')};});out.ids=ids;
          for(const [n,i] of Object.entries(ids)){ if(!i)continue; await pg.goto('https://checknam.com/z/'+i,{waitUntil:'domcontentloaded',timeout:60000});await new Promise(r=>setTimeout(r,25000));
            out[n]=await pg.evaluate(()=>{const a=document.getElementById('alert');const pl=a.querySelector('.ld-pl');const pr=a.querySelector('.prep');return {do:(a.querySelector('.ld-do')||{}).innerText,prep:pr?pr.innerText.slice(0,1800):null,zRef:riskCore().zRef};}); }
          out.errs=errs;require('fs').writeFileSync('out.json',JSON.stringify(out,null,1));await b.close();})();
          JS
          node t.js 2> err.txt || echo fail > out.json
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
