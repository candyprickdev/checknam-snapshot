name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq fonts-thai-tlwg >/dev/null 2>&1 || true
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');const S='https://checknam.com';
          const RAIN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14.5a4.5 4.5 0 1 1 .9-8.9A5.5 5.5 0 0 1 18.5 7.5 3.5 3.5 0 0 1 17.5 14.5"/><path d="M9 17.5l-1 3M13 17.5l-1 3M17 17.5l-1 3"/></svg>';
          const CH='<svg class="ch" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
          const CSS=`
          .wa{--sv:#c25400;--svi:#b34a00}
          :root[data-theme=dark] .wa,:root[data-theme=dim] .wa{--svi:#ff9a4d}
          .wa .ch{width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2}
          /* C1 แถบติดใต้ภาพ */
          .c1{position:relative;margin:0 -16px 14px;padding:12px 16px 13px;display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--sv) 9%,var(--panel));border-bottom:1px solid color-mix(in srgb,var(--sv) 18%,transparent)}
          .c1 .ic{width:24px;height:24px;color:var(--svi);flex:none}
          .c1 .tx{flex:1;min-width:0;font-size:.95rem;color:var(--ink);line-height:1.35}.c1 .tx b{font-weight:700;color:var(--svi)}
          .c1 .tm{font-size:.78rem;color:var(--muted);white-space:nowrap}
          .c1 .pg{position:absolute;left:0;bottom:-1px;height:2px;width:64%;background:var(--sv)}
          /* C2 การ์ดซ้อนขอบภาพ */
          .c2{position:relative;z-index:3;margin:-22px 4px 14px;padding:12px 14px;display:flex;align-items:center;gap:12px;border-radius:16px;background:var(--panel);box-shadow:0 8px 24px -10px rgba(10,30,40,.28),0 0 0 1px color-mix(in srgb,var(--line) 70%,transparent)}
          .c2 .ic{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;color:#fff;background:var(--sv)}.c2 .ic svg{width:22px;height:22px}
          .c2 .tx{flex:1;min-width:0}.c2 .k{display:block;font-size:.74rem;color:var(--muted)}.c2 .t{display:block;font-size:1.02rem;font-weight:700;color:var(--ink);line-height:1.3}
          .c2 .tm{font-size:.74rem;font-weight:600;color:var(--svi);background:color-mix(in srgb,var(--sv) 12%,transparent);padding:3px 8px;border-radius:999px;white-space:nowrap}`;
          const C1=`<div class="wa c1"><span class="ic">${RAIN}</span><span class="tx">กรมอุตุฯ เตือน<b>ฝนตกหนัก</b>ในพื้นที่นี้</span><span class="tm">ถึง 18:00 น.</span>${CH}<i class="pg"></i></div>`;
          const C2=`<div class="wa c2"><span class="ic">${RAIN}</span><span class="tx"><span class="k">ประกาศกรมอุตุนิยมวิทยา</span><span class="t">ฝนตกหนัก ถึง 18:00 น.</span></span><span class="tm">อีก 8 ชม.</span>${CH}</div>`;
          (async()=>{const out={};
          for (const [n,th,v] of [['d1','light',1],['d2','light',2],['e1','dark',1],['e2','dark',2]]){const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const pg=await b.newPage();await pg.setViewport({width:390,height:844,deviceScaleFactor:2});
          await pg.evaluateOnNewDocument(new Function(`localStorage.setItem('nbi_mode','easy');localStorage.setItem('nbi_th','${th}');localStorage.setItem('nbi_zone','นนทบุรี/บางใหญ่');`));
          await pg.goto(S+'/',{waitUntil:'domcontentloaded',timeout:60000});await new Promise(r=>setTimeout(r,22000));
          out[n]=await pg.evaluate((CSS,H)=>{const st=document.createElement('style');st.textContent=CSS;document.head.appendChild(st);const x=document.querySelector('#easy .ez-x');x.insertAdjacentHTML('afterend',H);const b=document.getElementById('ezBar');if(b)b.remove();scrollTo(0,0);return true},CSS,v===1?C1:C2);
          await new Promise(r=>setTimeout(r,900));await pg.screenshot({path:n+'.png',clip:{x:0,y:180,width:390,height:560}});await b.close();}
          require('fs').writeFileSync('out.json',JSON.stringify(out));})();
          JS
          node t.js 2> err.txt || true
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
