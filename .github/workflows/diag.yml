name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: { ref: diag }
      - run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq osmium-tool >/dev/null
          mkdir d; cp rnames.json d/; cd d
          curl -s -L -m 1200 -o th.pbf https://download.geofabrik.de/asia/thailand-latest.osm.pbf; ls -la th.pbf
          osmium tags-filter th.pbf w/waterway=river,canal,stream -o ww.pbf --overwrite
          osmium export ww.pbf -f geojsonseq -o ww.geojsonseq --overwrite --geometry-types=linestring
          ls -la
          python3 - <<'PY'
          import json,math
          want=set(json.load(open('rnames.json')))
          def dp(pts,eps):
            if len(pts)<3: return pts
            st=[(0,len(pts)-1)]; keep={0,len(pts)-1}
            while st:
              i,j=st.pop(); a,b=pts[i],pts[j]; dx,dy=b[0]-a[0],b[1]-a[1]; L=math.hypot(dx,dy) or 1e-12; mi,md=-1,0
              for k in range(i+1,j):
                p=pts[k]; d=abs(dy*(p[0]-a[0])-dx*(p[1]-a[1]))/L
                if d>md: mi,md=k,d
              if md>eps: keep.add(mi); st+= [(i,mi),(mi,j)]
            return [pts[k] for k in sorted(keep)]
          out={}; n=0
          for line in open('ww.geojsonseq'):
            line=line.strip().lstrip('\x1e')
            if not line: continue
            f=json.loads(line); t=f.get('properties',{}); nm=t.get('name:th') or t.get('name')
            if not nm: continue
            w=t.get('waterway')
            if w!='river' and nm not in want: continue
            pts=[[round(c[1],4),round(c[0],4)] for c in f['geometry']['coordinates']]
            pts=dp(pts,0.0012)
            if len(pts)>=2: out.setdefault(nm,{'w':w,'l':[]})['l'].append(pts); n+=1
          json.dump(out,open('ovs.json','w'),ensure_ascii=False,separators=(',',':'))
          print('names',len(out),'ways',n)
          PY
          rm -f th.pbf ww.pbf ww.geojsonseq rnames.json
          ls -la; gzip -9 ovs.json
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
