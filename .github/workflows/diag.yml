name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');(async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const out={};
          const pg=await b.newPage();await pg.setViewport({width:1280,height:900});const errs=[];pg.on('pageerror',e=>errs.push(e.message));
          await pg.goto('https://checknam.com/z/1',{waitUntil:'domcontentloaded',timeout:60000});await new Promise(r=>setTimeout(r,35000));
          out.a=await pg.evaluate(()=>{const lvP=p=>RAMP.findIndex(r=>p<=r[0])+1;const R={n:DATA.length,valid:0,mis:[],stale:0,staleValid:0,inval:[],src:{}};
            for(const d of DATA){const s=d.src||'tw';R.src[s]=(R.src[s]||0)+1; const st=isStale(d); if(st)R.stale++;
              if(validPct(d)){R.valid++; if(st)R.staleValid++; const a=lvP(+d.storage_percent),b=+d.situation_level||0; if(a!==b&&R.mis.length<40)R.mis.push([nm(d),s,(+d.storage_percent).toFixed(1),b,a]); if(a!==b)R.misN=(R.misN||0)+1;}
              else if(!isNaN(+d.waterlevel_msl)&&R.inval.length<15)R.inval.push([nm(d),s,d.storage_percent,d.situation_level]);}
            return R;});
          out.errs=errs;require('fs').writeFileSync('out.json',JSON.stringify(out,null,1));await b.close();})();
          JS
          node t.js 2> err.txt || echo fail > out.json
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
