name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');(async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const out={};
          const pg=await b.newPage();const errs=[];pg.on('pageerror',e=>errs.push(e.message));
          await pg.emulateMediaFeatures([{name:'prefers-color-scheme',value:'light'}]);
          const th=()=>pg.evaluate(()=>[document.documentElement.dataset.theme||'(none)',localStorage.getItem('nbi_th'),getComputedStyle(document.body).backgroundColor]);
          await pg.goto('https://checknam.com/z/1',{waitUntil:'domcontentloaded',timeout:60000});await new Promise(r=>setTimeout(r,8000));out.first=await th();
          await pg.evaluate(()=>document.querySelector('.theme button[data-t=light]').click());await pg.reload({waitUntil:'domcontentloaded'});await new Promise(r=>setTimeout(r,5000));out.afterLight=await th();
          await pg.goto('https://checknam.com/zones',{waitUntil:'domcontentloaded'});out.zones=await th();
          await pg.evaluate(()=>localStorage.clear());await pg.goto('https://checknam.com/changelog',{waitUntil:'domcontentloaded'});out.clFresh=await th();
          out.errs=errs;require('fs').writeFileSync('out.json',JSON.stringify(out,null,1));await b.close();})();
          JS
          node t.js 2> err.txt || echo fail > out.json
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
