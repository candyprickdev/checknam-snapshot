name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq fonts-thai-tlwg >/dev/null 2>&1 || true
          mkdir d; cd d
          curl -s -m 30 -A 'checknam.com (+https://checknam.com)' 'https://api-v3.thaiwater.net/api/v1/thaiwater30/public/warning' > warning.json || true
          npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');const fs=require('fs');const W=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const j=JSON.parse(fs.readFileSync('warning.json','utf8'));const zs=[];for(const x of j.data.slice(0,3))for(const l of x.message.split(/\n+/)){const am=(/อ\.\s?(\S+)/.exec(l)||[])[1],pv=(/จ\.\s?(\S+)/.exec(l)||[])[1];if(am&&pv)zs.push(pv+'/'+am);}
          fs.writeFileSync('zs.txt',zs.join('\n'));
          {const pg=await b.newPage();await pg.evaluateOnNewDocument(z=>{localStorage.setItem('nbi_mode','easy');localStorage.setItem('nbi_th','dark');localStorage.setItem('nbi_zone',z);},zs[0]);await pg.setViewport({width:430,height:900});
          await pg.goto('https://checknam.com/',{waitUntil:'domcontentloaded'});await W(16000);
          const r=await pg.evaluate(async()=>{const x=await fetch('/api/tw/warning');const t=await x.text();const e=document.getElementById('twarn');return {st:x.status,src:x.headers.get('x-src')||x.headers.get('x-cache'),t:t.slice(0,150),n:HIIW?HIIW.length:-1,f:hiiFor().length,tw:e.innerText.slice(0,300)};});
          await pg.evaluate(()=>{const e=document.getElementById('twarn');scrollTo(0,e.getBoundingClientRect().top+scrollY-120);const d=e.querySelector('details');if(d)d.open=true;});await W(800);await pg.screenshot({path:'hii.png'});
          fs.writeFileSync('dbg.txt',zs[0]+'\n'+JSON.stringify(r,null,1));await pg.close();}
          await b.close();})();

          JS
          node t.js 2> err.txt || true
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
