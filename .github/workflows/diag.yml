name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');(async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const out={};
          const scan=()=>{const c={},fl=[];for(const k of Object.keys(PLACES)){const r=zoneRisk(k);if(!r)continue;const n=r.noWL?'na':r.L.name;c[n]=(c[n]||0)+1;if(r.floT)fl.push(PLACES[k][0]+'|'+PLACES[k][3]+'|'+r.L.name+'|'+r.score+'|'+r.floT.replace(/<[^>]+>/g,''));}return {c,fl:fl.slice(0,80),nfl:fl.length};};
          for(const [nm,host] of [['stage','https://stage.checknam.pages.dev'],['prod','https://checknam.com']]){
            const pg=await b.newPage();await pg.setViewport({width:1280,height:900});const errs=[];pg.on('pageerror',e=>errs.push(e.message));
            await pg.goto(host+'/z/163',{waitUntil:'domcontentloaded',timeout:60000});await new Promise(r=>setTimeout(r,35000));
            try{out[nm]={scan:await pg.evaluate(scan),alert:await pg.evaluate(()=>document.getElementById('alert').innerText.slice(0,3000)),errs};}catch(e){out[nm]={e:e.message,errs};}
            await pg.close(); }
          require('fs').writeFileSync('out.json',JSON.stringify(out,null,1));await b.close();})();
          JS
          node t.js 2> err.txt || echo fail > out.json
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
