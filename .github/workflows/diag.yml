name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');(async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const out={};
          const pg=await b.newPage(); const errs=[]; pg.on('pageerror',e=>errs.push(e.message));
          await pg.goto('https://stage.checknam.pages.dev/z/1',{waitUntil:'domcontentloaded',timeout:60000}); await new Promise(r=>setTimeout(r,45000));
          out.r=await pg.evaluate(()=>{ const t0=performance.now(); const zl=zoneLevels(); const ms=performance.now()-t0;
            const rc=riskCore(); const f0=rc.f? rc.f[0] : null; const here=zoneLevelAt(PLACES[place][1],PLACES[place][2]);
            return {ms:Math.round(ms), n:zl.z.length, withData:zl.z.filter(x=>x).length, sample:[0,1,2,100,500,927].map(i=>[ZKEYS[i],zl.z[i]]), place, f0v:f0&&f0.v, here:here&&[here.p,here.lv,here.st,here.t], share:shareInfo(), wd:navigator.webdriver, bma:BMA_N, dwr:DWR_N, size:JSON.stringify(zl).length}; });
          out.errs=errs; require('fs').writeFileSync('out.json',JSON.stringify(out,null,1)); await b.close();})();
          JS
          node t.js 2> err.txt || true
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
