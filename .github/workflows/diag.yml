name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');(async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const out={};
          const pg=await b.newPage();
          await pg.goto('https://checknam.com/z/1',{waitUntil:'domcontentloaded',timeout:60000});await new Promise(r=>setTimeout(r,35000));
          out.r=await pg.evaluate(()=>{
            const pts=[];for(const r of RIVER_GEO){if(r.h)continue;for(const l of r.l)for(let i=1;i<l.length;i++)pts.push([l[i-1],l[i],r.n]);}
            const G=new Map(),C=.05;for(const s of pts){const la0=Math.min(s[0][0],s[1][0]),la1=Math.max(s[0][0],s[1][0]),lo0=Math.min(s[0][1],s[1][1]),lo1=Math.max(s[0][1],s[1][1]);for(let i=Math.floor(la0/C)-1;i<=Math.floor(la1/C)+1;i++)for(let j=Math.floor(lo0/C)-1;j<=Math.floor(lo1/C)+1;j++){const k=i+'_'+j;(G.get(k)||G.set(k,[]).get(k)).push(s);}}
            const dist=(la,lo)=>{let m=1e9,n=null;for(const s of (G.get(Math.floor(la/C)+'_'+Math.floor(lo/C))||[])){const ax=(s[0][1]-lo)*108,ay=(s[0][0]-la)*111,bx=(s[1][1]-lo)*108,by=(s[1][0]-la)*111,vx=bx-ax,vy=by-ay,L=vx*vx+vy*vy;let t=L?-(ax*vx+ay*vy)/L:0;t=t<0?0:t>1?1:t;const px=ax+vx*t,py=ay+vy*t,d=Math.sqrt(px*px+py*py);if(d<m){m=d;n=s[2];}}return [m,n];};
            const res={total:0,far:0,noName:0,byProv:{},rivers:{},sample:[]};
            for(const d of DATA){const la=+d.station.tele_station_lat,lo=+d.station.tele_station_long;if(!la)continue;res.total++;const [m,n]=dist(la,lo);if(m>1){res.far++;const pv=d.geocode?.province_name?.th||'?';res.byProv[pv]=(res.byProv[pv]||0)+1;const rn=d.river_name||'(ไม่มีชื่อ)';res.rivers[rn]=(res.rivers[rn]||0)+1;if(!d.river_name)res.noName++;if(res.sample.length<25)res.sample.push([nm(d),rn,pv,m>100?'>5km':m.toFixed(1)]);}}
            res.nRiversGeo=RIVER_GEO.length; res.topRivers=Object.entries(res.rivers).sort((a,b)=>b[1]-a[1]).slice(0,40); delete res.rivers; res.byProv=Object.entries(res.byProv).sort((a,b)=>b[1]-a[1]).slice(0,25); return res;});
          require('fs').writeFileSync('out.json',JSON.stringify(out,null,1));await b.close();})();
          JS
          node t.js 2> err.txt || echo fail > out.json
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
