name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq fonts-thai-tlwg >/dev/null 2>&1 || true
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');const S='https://checknam.com';
          (async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const out={};
          for (const [n,z] of [['by','นนทบุรี/บางใหญ่'],['cm','เชียงใหม่/เมืองเชียงใหม่']]){const cx=await b.createBrowserContext();const pg=await cx.newPage();const errs=[];pg.on('pageerror',e=>errs.push(e.message));await pg.setViewport({width:390,height:844,deviceScaleFactor:2});
          await pg.evaluateOnNewDocument(new Function(`localStorage.setItem('nbi_mode','easy');localStorage.setItem('nbi_th','light');localStorage.setItem('nbi_zone',${JSON.stringify(z)});`));
          await pg.goto(S+'/',{waitUntil:'domcontentloaded',timeout:60000});await new Promise(r=>setTimeout(r,26000));
          out[n]={errs,tk:await pg.evaluate(()=>TMDF_K===llKey(place)&&TMDF?{h:TMDF.h.length,d:TMDF.d.length}:null),easy:await pg.evaluate(()=>{const d=document.createElement('div');d.innerHTML=rainAhead(false);return d.innerText}),full:await pg.evaluate(()=>{const d=document.createElement('div');d.innerHTML=rainAhead(true);return d.innerText})};
          await cx.close();}
          require('fs').writeFileSync('out.json',JSON.stringify(out,null,1));await b.close();})();
          JS
          node t.js 2> err.txt || true
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
