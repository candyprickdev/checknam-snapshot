name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');(async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const out={};
          for(const z of [864,650,1,700]){const pg=await b.newPage();await pg.setViewport({width:390,height:900});const errs=[];pg.on('pageerror',e=>errs.push(e.message));
            await pg.goto('https://checknam.com/z/'+z,{waitUntil:'domcontentloaded',timeout:60000});await new Promise(r=>setTimeout(r,14000));
            out[z]=await pg.evaluate(()=>{const vis=e=>!e.hidden&&getComputedStyle(e).display!=='none';return {zone:document.querySelector('#zpBtn,.zp-b')?.innerText||document.title,
              camf:[...document.querySelectorAll('.camf')].map(e=>({hidden:e.hidden,shown:vis(e),t:e.innerText.slice(0,80)})),
              sat:(()=>{const e=document.getElementById('satNote');return e?{hidden:e.hidden,shown:vis(e)}:null})(),
              paths:document.querySelectorAll('#map path').length,canv:document.querySelectorAll('#map canvas').length}});
            out[z].errs=errs;
            const tb=await pg.$$('button');for(const x of tb){const t=await x.evaluate(e=>e.innerText.trim());if(t==='กล้อง'){await x.click();break;}}
            await new Promise(r=>setTimeout(r,2500));await pg.screenshot({path:'cam'+z+'.png'});await pg.close();}
          require('fs').writeFileSync('out.json',JSON.stringify(out,null,1));await b.close();})();
          JS
          node t.js || echo fail > out.json
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
