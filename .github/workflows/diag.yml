name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq fonts-thai-tlwg >/dev/null 2>&1 || true
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');const S='https://checknam.com';const fs=require('fs');const W=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          for(const [w,h] of [[320,640],[390,844],[768,1024],[1024,768],[1440,900]]){const pg=await b.newPage();const errs=[];pg.on('pageerror',e=>errs.push(e.message));await pg.setViewport({width:w,height:h,deviceScaleFactor:1});
          await pg.evaluateOnNewDocument(()=>{localStorage.setItem('nbi_mode','easy');localStorage.setItem('nbi_th','light');localStorage.setItem('nbi_zone','นนทบุรี/บางใหญ่');});
          await pg.goto(S+'/',{waitUntil:'domcontentloaded',timeout:60000});await W(20000);
          for(let y=0;y<12000;y+=600){await pg.evaluate(y=>scrollTo(0,y),y);await W(150);}await pg.evaluate(()=>scrollTo(0,0));await W(1000);
          const info=await pg.evaluate(()=>{const sw=document.documentElement.scrollWidth,cw=document.documentElement.clientWidth;const over=[];document.querySelectorAll('body *').forEach(e=>{const r=e.getBoundingClientRect();if(r.width>0&&r.right>cw+1&&getComputedStyle(e).position!=='fixed'){over.push((e.id||e.className||e.tagName).toString().slice(0,40)+' '+Math.round(r.right));}});return {sw,cw,H:document.documentElement.scrollHeight,over:over.slice(0,25)};});
          fs.appendFileSync('info.txt',w+': '+JSON.stringify(info)+' errs='+JSON.stringify(errs)+'\n');
          await pg.screenshot({path:`w${w}.png`,fullPage:true});await pg.close();}
          await b.close();})();
          JS
          node t.js 2> err.txt || true
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
