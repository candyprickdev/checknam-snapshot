name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d; cd d
          UA="checknam.com (+https://checknam.com)"
          for u in "warn https://tmd.go.th/api/xml/warning-news" "cap https://www.tmd.go.th/en/api/xml/CAP" "storm https://tmd.go.th/en/api/xml/storm-tracking" "bkk https://tmd.go.th/api/xml/region-daily-forecast?regionid=7"; do set -- $u; curl -sS -m 40 -A "$UA" -o "$1.xml" -w "$1 %{http_code} %{size_download} %{content_type}\n" "$2" >> st.txt 2>&1 || echo "$1 fail" >> st.txt; done
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
