name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq fonts-thai-tlwg >/dev/null 2>&1 || true
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');const S='https://stage.checknam.pages.dev';
          (async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const out={};
          for(const [z,th] of [[1,'dark'],[600,'light']]){const cx=await b.createBrowserContext();const pg=await cx.newPage();const errs=[];pg.on('pageerror',e=>errs.push(e.message));await pg.setViewport({width:390,height:844,deviceScaleFactor:2});
          await pg.evaluateOnNewDocument((t)=>{localStorage.setItem('nbi_th',t);localStorage.setItem('nbi_mode','easy')},th);
          await pg.goto(S+'/z/'+z,{waitUntil:'domcontentloaded',timeout:60000});await new Promise(r=>setTimeout(r,26000));
          await pg.evaluate(()=>{const b=document.getElementById('ezBar');if(b)b.remove();});
          const el=await pg.$('#easy .ez-box:has(.ra)');if(el){await el.screenshot({path:'nx'+z+'.png'});await pg.evaluate(()=>document.querySelector('#easy .ra-d').open=true);await new Promise(r=>setTimeout(r,300));await el.screenshot({path:'nxo'+z+'.png'});}
          out[z]={errs};await cx.close();}
          require('fs').writeFileSync('out.json',JSON.stringify(out,null,1));await b.close();})();
          JS
          node t.js 2> err.txt || true
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
