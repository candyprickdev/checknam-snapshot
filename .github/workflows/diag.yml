name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d; cd d
          UA="checknam.com (+https://checknam.com)"
          for u in "th1 https://www.tmd.go.th/uploads/CAP/CAPTMD20261011062847_2.xml" "capth https://www.tmd.go.th/api/xml/CAP" "pgth https://www.tmd.go.th/CAP" "pgen https://www.tmd.go.th/en/CAP"; do set -- $u; curl -sS -L -m 40 -A "$UA" -o "$1.xml" -w "$1 %{http_code} %{size_download} %{content_type} %{url_effective}\n" "$2" >> st.txt 2>&1 || echo "$1 fail" >> st.txt; done
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
