name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');(async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const out={};
          const pg=await b.newPage(); await pg.setViewport({width:1000,height:800}); const errs=[];pg.on('pageerror',e=>errs.push(e.message));
          await pg.goto('https://checknam.com/z/1',{waitUntil:'domcontentloaded',timeout:60000}); await new Promise(r=>setTimeout(r,35000));
          out.r=await pg.evaluate(async()=>{ document.querySelector('#tFlow').checked=true; MAP.setZoom(11); drawFlow(); await new Promise(r=>setTimeout(r,500));
            const segs=[]; const walk=g=>g.eachLayer(l=>{ if(l.eachLayer) return walk(l); if(l.options&&l.options.color==="#8fb7c7"){ const ll=l.getLatLngs(); const arr=Array.isArray(ll[0])?ll:[ll]; for(const line of arr) for(let i=1;i<line.length;i++) segs.push([line[i-1],line[i],l.getTooltip&&l.getTooltip()?String(l.getTooltip().getContent()).slice(0,80):""]); } });
            walk(FLOW); walk(FLOWM);
            const bad=[]; for(const d of DATA){ if(!validPct(d)||isStale(d)) continue; const la=+d.station.tele_station_lat, lo=+d.station.tele_station_long; let best=1e9,tt="";
              for(const [a,b,t] of segs){ const ax=(a.lng-lo)*108, ay=(a.lat-la)*111, bx=(b.lng-lo)*108, by=(b.lat-la)*111, vx=bx-ax, vy=by-ay, L2=vx*vx+vy*vy; let u=L2?-(ax*vx+ay*vy)/L2:0; u=u<0?0:u>1?1:u; const dd=Math.hypot(ax+vx*u,ay+vy*u); if(dd<best){best=dd;tt=t;} }
              if(best<=1.5) bad.push({id:d.station.id,n:d.station.tele_station_name?.th,amp:d.geocode?.amphoe_name?.th,rv:d.river_name,p:d.storage_percent,km:+best.toFixed(2),tt}); }
            return {ver:(typeof APPV!=="undefined"?APPV:""), nseg:segs.length, bad}; });
          out.errs=errs; require('fs').writeFileSync('out.json',JSON.stringify(out,null,1)); await b.close();})();
          JS
          node t.js 2> err.txt || true
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
