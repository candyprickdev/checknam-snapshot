name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');(async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const out={};
          const pg=await b.newPage();await pg.setViewport({width:1280,height:900});const errs=[];pg.on('pageerror',e=>errs.push(e.message));
          await pg.goto('https://stage.checknam.pages.dev/z/163',{waitUntil:'domcontentloaded',timeout:60000});await new Promise(r=>setTimeout(r,30000));
          out.scan0=1;out.scan=await pg.evaluate(()=>{const keys=Object.keys(PLACES);const na=[];for(const k of keys){const r=zoneRisk(k);if(r&&r.noWL)na.push(k+'|'+PLACES[k][3]);}return {n:keys.length,na:na.length,sample:na.slice(0,40)};});
          const k=out.scan.sample[0]?out.scan.sample[0].split('|')[0]:null;
          if(k){ out.k=k; out.page=await pg.evaluate(async(k)=>{ const zi=Object.keys(PLACES).indexOf(k)+1; return zi; },k);
            await pg.goto('https://stage.checknam.pages.dev/z/'+out.page,{waitUntil:'domcontentloaded',timeout:60000});await new Promise(r=>setTimeout(r,30000));
            out.alert=await pg.evaluate(()=>document.getElementById('alert').innerText.slice(0,1500)); }
          out.errs=errs;
          require('fs').writeFileSync('out.json',JSON.stringify(out,null,1));await b.close();})();
          JS
          node t.js 2> err.txt || echo fail > out.json
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
