name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq fonts-thai-tlwg >/dev/null 2>&1 || true
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');const S='https://stage.checknam.pages.dev';
          (async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const out={};
          const shot=async(name,setup,after)=>{const cx=await b.createBrowserContext();const pg=await cx.newPage();const errs=[];pg.on('pageerror',e=>errs.push(e.message));await pg.setViewport({width:390,height:844,deviceScaleFactor:2});
           await pg.evaluateOnNewDocument(setup);await pg.goto(S+'/',{waitUntil:'domcontentloaded',timeout:60000});await new Promise(r=>setTimeout(r,24000));
           const r=await pg.evaluate(after);await pg.evaluate(()=>{const b=document.getElementById('ezBar');if(b)b.remove();scrollTo(0,0)});await pg.screenshot({path:name+'.png',clip:{x:0,y:0,width:390,height:1300}});out[name]={errs,r};await cx.close();};
          const info=()=>{const rc=riskCore();const f=rc.f.find(x=>x.t==='ระดับน้ำใกล้เขต');return {zone:place,mx:rc.mx&&nm(rc.mx),how:rc.nearHow,n:rc.near.length,L:rc.L&&rc.L.name,lvl:f&&f.v,d:f&&f.d,floT:rc.floT,rd:(document.querySelector('#easy .ez-x .rd')||{}).innerText,say:(document.querySelector('.ez-say2')||{}).innerText,al:(document.querySelector('#alert')||{}).innerText,surr:(rc.f.find(x=>x.t==='จุดล้นตลิ่งรอบเขต')||{}).d}};
          await shot('ic',()=>{localStorage.setItem('nbi_mode','easy');localStorage.setItem('nbi_th','light');localStorage.setItem('nbi_pin',JSON.stringify({la:13.7267,lo:100.5106}));localStorage.setItem('nbi_zone','__pin__');},info);
          for(const [n,z] of [['ks','กรุงเทพมหานคร/คลองสาน'],['by','นนทบุรี/บางใหญ่'],['bp','กรุงเทพมหานคร/บางพลัด'],['tc','กรุงเทพมหานคร/ตลิ่งชัน'],['sn','พระนครศรีอยุธยา/เสนา']]) await shot(n,new Function(`localStorage.setItem('nbi_mode','easy');localStorage.setItem('nbi_th','light');localStorage.setItem('nbi_zone',${JSON.stringify(z)});`),info);
          {const pg=await b.newPage();await pg.goto(S+'/',{waitUntil:'domcontentloaded',timeout:60000});await new Promise(r=>setTimeout(r,20000));out.zl=await pg.evaluate(()=>{const z=zoneLevels();return ZKEYS.map((k,i)=>[k,z.z[i]])});}
          require('fs').writeFileSync('out.json',JSON.stringify(out));await b.close();})();
          JS
          node t.js 2> err.txt || true
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
