name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq fonts-thai-tlwg >/dev/null 2>&1 || true
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');const S='https://checknam.com';
          (async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const pg=await b.newPage();await pg.setViewport({width:390,height:844,deviceScaleFactor:1});
          await pg.evaluateOnNewDocument(()=>{localStorage.setItem('nbi_mode','full');localStorage.setItem('nbi_th','light');localStorage.setItem('nbi_zone','นนทบุรี/บางใหญ่');});
          await pg.goto(S+'/',{waitUntil:'domcontentloaded',timeout:60000});await new Promise(r=>setTimeout(r,25000));
          for(let y=0;y<30000;y+=700){await pg.evaluate(y=>scrollTo(0,y),y);await new Promise(r=>setTimeout(r,250));}
          await pg.evaluate(()=>scrollTo(0,0));await new Promise(r=>setTimeout(r,1500));
          const out=await pg.evaluate(()=>{const R=[];const vis=e=>{const s=getComputedStyle(e);return s.display!=='none'&&s.visibility!=='hidden'&&e.offsetHeight>0};
          document.querySelectorAll('header, nav, #s-sum > *, .wrap > section, .wrap > div, footer').forEach(e=>{if(!vis(e))return;const r=e.getBoundingClientRect();R.push({tag:e.tagName,id:e.id,cls:e.className&&String(e.className).slice(0,40),y:Math.round(r.top+scrollY),h:Math.round(r.height),txt:e.innerText.replace(/\s+/g,' ').slice(0,700)});});return R;});
          require('fs').writeFileSync('out.json',JSON.stringify(out,null,1));
          const H=await pg.evaluate(()=>document.documentElement.scrollHeight);
          for(let i=0,y=0;y<H&&i<16;i++,y+=1600){await pg.screenshot({path:`f${String(i).padStart(2,'0')}.png`,clip:{x:0,y,width:390,height:Math.min(1600,H-y)},captureBeyondViewport:true});}
          await b.close();})();
          JS
          node t.js 2> err.txt || true
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
