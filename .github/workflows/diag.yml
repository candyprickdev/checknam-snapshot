name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');(async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const out={};
          const pg=await b.newPage(); await pg.setViewport({width:1000,height:800}); const errs=[];pg.on('pageerror',e=>errs.push(e.message));
          await pg.goto('https://stage.checknam.pages.dev/z/1',{waitUntil:'domcontentloaded',timeout:60000}); await new Promise(r=>setTimeout(r,35000));
          out.cov=await pg.evaluate(()=>{const RST=riverStations();let on=0;for(const v of RST.values())on+=v.length;let fresh=0;for(const d of DATA)if(validPct(d)&&!isStale(d))fresh++;return {fresh,attached:on,entries:RST.size};});
          for (const [nm,amp] of [['wp','วังโป่ง'],['ds','ด่านซ้าย']]){ const zi=await pg.evaluate(a=>Object.keys(PLACES).findIndex(k=>PLACES[k][0]===a)+1,amp);
            await pg.goto('https://stage.checknam.pages.dev/z/'+zi,{waitUntil:'domcontentloaded'}); await new Promise(r=>setTimeout(r,30000));
            const m=await pg.$('#map'); await m.scrollIntoView(); await new Promise(r=>setTimeout(r,5000)); await m.screenshot({path:nm+'.png'}); }
          out.errs=errs; require('fs').writeFileSync('out.json',JSON.stringify(out,null,1)); await b.close();})();
          JS
          node t.js 2> err.txt
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
