name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');(async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const out={};
          for (const z of ['1','163','743']){ const pg=await b.newPage();const errs=[];pg.on('pageerror',e=>errs.push(e.message));const t0=Date.now();
            await pg.goto('https://checknam.com/z/'+z+'?d='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            let ok=false; try{ await pg.waitForFunction(()=>(document.querySelector('#alert .lede')?.innerText||'').length>80 && document.querySelectorAll('#nbiCards .card').length>0,null,{timeout:60000}); ok=true;}catch(e){}
            out[z]={ok,ms:Date.now()-t0,errs,ver:await pg.evaluate(()=>document.querySelector('script[src*="app-"]')?.src||'')}; await pg.close(); }
          require('fs').writeFileSync('out.json',JSON.stringify(out,null,1));await b.close();})();
          JS
          node t.js 2> err.txt || echo fail > out.json
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
