name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq fonts-thai-tlwg >/dev/null 2>&1 || true
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');const S='https://stage.checknam.pages.dev';const fs=require('fs');const W=ms=>new Promise(r=>setTimeout(r,ms));
          async function run(name,ls,steps){const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const pg=await b.newPage();const errs=[];pg.on('pageerror',e=>errs.push(e.message));await pg.setViewport({width:390,height:844,deviceScaleFactor:2});
          await pg.evaluateOnNewDocument(ls=>{for(const k in ls)localStorage.setItem(k,ls[k]);},ls);
          await pg.goto(S+'/',{waitUntil:'domcontentloaded',timeout:60000});await W(22000);
          let i=0;for(const s of steps){await pg.evaluate(s);await W(1200);await pg.screenshot({path:`${name}${i++}.png`});}
          fs.appendFileSync('errs.txt',name+': '+JSON.stringify(errs)+'\n');await b.close();}
          (async()=>{const base={nbi_mode:'full',nbi_th:'light',nbi_zone:'นนทบุรี/บางใหญ่',nbi_zp_seen:'1'};
          const top=()=>{const n=document.querySelector('nav.zone');scrollTo(0,n.getBoundingClientRect().top+scrollY-12);};
          await run('a',base,[`(${top})()`,`document.getElementById('zhTg').click();(${top})()`,`document.getElementById('zpBtn').click()`]);
          await run('b',{...base,nbi_pin:JSON.stringify({la:13.8616,lo:100.4062})},[`(${top})()`,`document.getElementById('zhTg').click()`]);
          await run('c',{...base,nbi_zone:'กรุงเทพมหานคร/บางรัก'},[`(${top})()`]);
          await run('e',{...base,nbi_mode:'easy'},[`scrollTo(0,0)`,`document.getElementById('ezPick').click()`]);
          await run('d',{...base,nbi_th:'dark'},[`(${top})()`,`document.getElementById('zhTg').click()`]);
          })();
          JS
          node t.js 2> err.txt || true
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
