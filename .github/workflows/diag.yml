name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq fonts-thai-tlwg >/dev/null 2>&1 || true
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          (async()=>{const U=['https://data.tmd.go.th/api/WeatherWarningNews/v1/?uid=api&ukey=api12345&format=json','https://data.tmd.go.th/api/WeatherWarningNews/v1/?uid=api&ukey=api12345','https://www.tmd.go.th/api/xml/warning-news','https://api.open-meteo.com/v1/forecast?latitude=13.91&longitude=100.5&hourly=precipitation&models=ecmwf_ifs025,gfs_seamless,icon_seamless,best_match&forecast_days=4&timezone=Asia%2FBangkok'];
          const out={};for(const u of U){try{const r=await fetch(u,{headers:{'user-agent':'Mozilla/5.0 checknam.com'},signal:AbortSignal.timeout(20000)});const t=await r.text();out[u]={s:r.status,ct:r.headers.get('content-type'),b:t.slice(0,1500)};}catch(e){out[u]={e:String(e)}}}
          require('fs').writeFileSync('tmd.json',JSON.stringify(out,null,1));})();
          JS
          node t.js 2> err.txt || true
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
