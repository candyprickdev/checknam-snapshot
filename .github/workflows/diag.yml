name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq fonts-thai-tlwg >/dev/null 2>&1 || true
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');const fs=require('fs');const W=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const pg=await b.newPage();await pg.setViewport({width:1440,height:900});
          await pg.evaluateOnNewDocument(()=>{if(!sessionStorage.getItem('x')){sessionStorage.setItem('x',1);localStorage.setItem('nbi_mode','easy');localStorage.setItem('nbi_zone','นนทบุรี/บางใหญ่');}});
          await pg.goto('https://stage.checknam.pages.dev/',{waitUntil:'domcontentloaded'});await W(16000);
          const tw=()=>pg.evaluate(()=>{const e=document.getElementById('twarn');return (e.offsetHeight?'SHOWN ':'hidden ')+e.innerText.slice(0,80);});
          fs.appendFileSync('sw.txt','before '+await tw()+'\n');
          await pg.evaluate(()=>{const s=document.getElementById('place');s.value='นครปฐม/สามพราน';s.onchange({target:s});});await W(8000);
          fs.appendFileSync('sw.txt','after samphran '+await tw()+'\n');await pg.screenshot({path:'sw1.png'});
          await pg.evaluate(()=>{const s=document.getElementById('place');s.value='นนทบุรี/ปากเกร็ด';s.onchange({target:s});});await W(8000);
          fs.appendFileSync('sw.txt','after pakkret '+await tw()+'\n');
          await b.close();})();
          JS
          node t.js 2> err.txt || true
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
