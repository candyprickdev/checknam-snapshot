name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d; cd d
          curl -s -m 60 "https://overpass-api.de/api/interpreter" --data-urlencode 'data=[out:json][timeout:50];(way(around:3000,14.320748,100.017395)[waterway];way(around:400,14.320748,100.017395)[highway];way(around:1500,14.320748,100.017395)[natural=water];);out tags geom;' > op.json || true
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
