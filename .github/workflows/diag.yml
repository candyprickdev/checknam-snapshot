name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq fonts-thai-tlwg >/dev/null 2>&1 || true
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');const S='https://checknam.com';
          (async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const pg=await b.newPage();await pg.setViewport({width:390,height:844,deviceScaleFactor:1.5});
          await pg.evaluateOnNewDocument(()=>{localStorage.setItem('nbi_th','light');localStorage.setItem('nbi_mode','easy')});
          await pg.goto(S+'/z/1',{waitUntil:'domcontentloaded',timeout:60000});await new Promise(r=>setTimeout(r,26000));
          await pg.evaluate(()=>{const b=document.getElementById('ezBar');if(b)b.remove();});
          const H=await pg.evaluate(()=>document.documentElement.scrollHeight);
          for(let i=0;i*1600<H;i++){await pg.screenshot({path:'full'+i+'.png',clip:{x:0,y:i*1600,width:390,height:Math.min(1600,H-i*1600)},captureBeyondViewport:true});}
          require('fs').writeFileSync('out.json',JSON.stringify({H}));await b.close();})();
          JS
          node t.js 2> err.txt || true
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
