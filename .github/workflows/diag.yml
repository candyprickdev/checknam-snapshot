name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');(async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const out={};
          const pg=await b.newPage(); await pg.setViewport({width:1000,height:800}); const errs=[];pg.on('pageerror',e=>errs.push(e.message));
          await pg.goto('https://stage.checknam.pages.dev/z/1',{waitUntil:'domcontentloaded',timeout:60000}); await new Promise(r=>setTimeout(r,30000)); { const m=await pg.$('#map'); await m.scrollIntoView(); await new Promise(r=>setTimeout(r,8000)); }
          out.r=await pg.evaluate(async()=>{ document.querySelector('#tFlow').checked=true; MAP.setZoom(11); drawFlow(); FLOW.addLayer(FLOWM); await new Promise(r=>setTimeout(r,500));
            const own=new Map(); const walk=g=>g.eachLayer(l=>{ if(l.eachLayer) return walk(l); const tt=l.getTooltip&&l.getTooltip(); if(!tt||l.options.color==="#8fb7c7") return; const c=String(tt.getContent()); const m=c.match(/ตามสถานี(.*?) \(ห่าง/); if(!m) return; const ll=l.getLatLngs(); const arr=Array.isArray(ll[0])?ll:[ll]; let a=own.get(m[1]); if(!a) own.set(m[1],a=[]); for(const line of arr) for(let i=1;i<line.length;i++) a.push([line[i-1],line[i]]); });
            walk(FLOW); walk(FLOWM);
            const RST=riverStations(); let att=0; for(const v of RST.values()) att+=v.length;
            const bad=[]; let dots=0; for(const d of DATA){ if(!lineOk(d)) continue; dots++; const la=+d.station.tele_station_lat, lo=+d.station.tele_station_long; let best=99;
              for(const [a,b] of (own.get(esc(nm(d)))||[])){ const ax=(a.lng-lo)*108, ay=(a.lat-la)*111, bx=(b.lng-lo)*108, by=(b.lat-la)*111, vx=bx-ax, vy=by-ay, L2=vx*vx+vy*vy; let u=L2?-(ax*vx+ay*vy)/L2:0; u=u<0?0:u>1?1:u; best=Math.min(best,Math.hypot(ax+vx*u,ay+vy*u)); }
              if(best>0.3){ const n=nearLine(la,lo); bad.push({id:String(d.station.id),n:nm(d),rv:d.river_name||"",own:+best.toFixed(2),near:n.r?n.r.n:"",nkm:+n.km.toFixed(2),note:lineNote(d).replace(/<br>/g,"").slice(0,140)}); } }
            const diff=[]; for(const [ri,ids] of RST) for(const id of ids){ const d=DATA.find(x=>String(x.station.id)===id); const r=RIVER_GEO[ri]; if(d.river_name && r.n && !rvSame(d.river_name,r) && !r.u && !r.hy) diff.push([id,nm(d),d.river_name,r.n]); }
            return {dots, att, bad, diff}; });
          out.errs=errs; require('fs').writeFileSync('out.json',JSON.stringify(out,null,1)); await b.close();})();
          JS
          node t.js 2> err.txt || true
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
