name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq fonts-thai-tlwg >/dev/null 2>&1 || true
          mkdir d; cd d
          npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');const fs=require('fs');const W=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          for(const [z,th] of [['ปราจีนบุรี/บ้านสร้าง','dark'],['นนทบุรี/บางใหญ่','light'],['เชียงใหม่/เมืองเชียงใหม่','dark']]){const pg=await b.newPage();await pg.setViewport({width:400,height:900,deviceScaleFactor:2});
          await pg.evaluateOnNewDocument((z,th)=>{localStorage.setItem('nbi_mode','easy');localStorage.setItem('nbi_th',th);localStorage.setItem('nbi_zone',z);},z,th);
          pg.on('pageerror',e=>fs.appendFileSync('err.txt',z+' '+e+'\n'));
          await pg.goto('https://checknam.com/',{waitUntil:'domcontentloaded'});await W(75000);
          const h=await pg.evaluateHandle(()=>[...document.querySelectorAll('.ez-box')].find(b=>/เทียบกับปีที่เคยท่วม/.test(b.textContent)));
          const el=h.asElement(); if(el){await el.evaluate(e=>{const d=e.querySelector('details');if(d)d.open=true;});await el.screenshot({path:z.split('/')[1]+'.png'});fs.appendFileSync('txt.txt',z+'\n'+await el.evaluate(e=>e.innerText)+'\n\n');} await pg.close();}
          await b.close();})();
          JS
          node t.js 2>> err.txt || true
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
