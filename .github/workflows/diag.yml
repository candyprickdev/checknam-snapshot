name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq fonts-thai-tlwg >/dev/null 2>&1 || true
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');const S='https://checknam.com';
          const RAIN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14.5a4.5 4.5 0 1 1 .9-8.9A5.5 5.5 0 0 1 18.5 7.5 3.5 3.5 0 0 1 17.5 14.5"/><path d="M9 17.5l-1 3M13 17.5l-1 3M17 17.5l-1 3"/></svg>';
          const CSS=`
          /* V1 ประกาศทางการ */
          .v1{position:relative;margin:4px 0 16px;border-radius:20px;overflow:hidden;color:#fff;background:linear-gradient(135deg,#d2601a 0%,#b54708 55%,#9a3a06 100%);box-shadow:0 10px 24px -12px rgba(154,58,6,.55)}
          .v1 .rn{position:absolute;inset:0;opacity:.18;background-image:repeating-linear-gradient(104deg,transparent 0 14px,rgba(255,255,255,.9) 14px 15px,transparent 15px 34px);background-size:200% 200%;animation:v1r 1.6s linear infinite;mask-image:linear-gradient(90deg,transparent,#000 40%)}
          @keyframes v1r{to{background-position:-34px 60px}}
          .v1 .row{position:relative;display:grid;grid-template-columns:56px 1fr 18px;gap:14px;align-items:center;padding:14px 16px}
          .v1 .ring{position:relative;width:56px;height:56px}.v1 .ring svg.r{position:absolute;inset:0;transform:rotate(-90deg)}
          .v1 .ring .ic{position:absolute;inset:14px;color:#fff}
          .v1 .k{font-size:.74rem;opacity:.85;font-weight:500}.v1 .t{display:block;font-size:1.32rem;font-weight:700;line-height:1.25;letter-spacing:-.005em}
          .v1 .s{display:block;font-size:.8rem;opacity:.9;margin-top:2px}.v1 .ch{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;opacity:.8}
          /* V2 ลอยบนท้องฟ้า */
          .v2{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:8px;padding:7px 12px 7px 9px;border-radius:999px;white-space:nowrap;
           background:color-mix(in srgb,var(--panel) 62%,transparent);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border:1px solid color-mix(in srgb,#fff 45%,transparent);box-shadow:0 6px 18px -8px rgba(0,0,0,.35);font-size:.82rem;color:var(--ink)}
          .v2 .dot{width:22px;height:22px;border-radius:50%;background:#c25400;color:#fff;display:grid;place-items:center;position:relative}.v2 .dot svg{width:14px;height:14px}
          .v2 .dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid #c25400;opacity:.0;animation:v2p 2s ease-out infinite}
          @keyframes v2p{0%{opacity:.6;transform:scale(.8)}100%{opacity:0;transform:scale(1.5)}}
          .v2 b{font-weight:700}.v2 .ch{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2}
          .ez-x .rd{padding-top:40px}
          /* V3 เส้นเวลา */
          .v3{margin:4px 0 16px;padding:14px 16px 12px;border-radius:18px;background:var(--panel);border:1px solid var(--line);box-shadow:0 1px 0 rgba(0,0,0,.02)}
          .v3 .top{display:flex;align-items:center;gap:10px}.v3 .ic{width:34px;height:34px;border-radius:10px;background:#c25400;color:#fff;display:grid;place-items:center}.v3 .ic svg{width:20px;height:20px}
          .v3 .t{font-size:1.06rem;font-weight:700;color:var(--ink);line-height:1.3}.v3 .k{display:block;font-size:.74rem;color:var(--muted)}
          .v3 .tl{margin-top:12px;position:relative;height:6px;border-radius:3px;background:color-mix(in srgb,#c25400 16%,transparent)}
          .v3 .tl i{position:absolute;left:0;top:0;bottom:0;width:36%;border-radius:3px;background:linear-gradient(90deg,color-mix(in srgb,#c25400 45%,transparent),#c25400)}
          .v3 .tl em{position:absolute;left:36%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--panel);border:3px solid #c25400}
          .v3 .lb{display:flex;justify-content:space-between;margin-top:7px;font-size:.74rem;color:var(--muted)}.v3 .lb b{color:#b34a00;font-weight:600}`;
          const ring=(f)=>{const r=24,c=2*Math.PI*r;return `<svg class="r" viewBox="0 0 56 56"><circle cx="28" cy="28" r="${r}" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="4"/><circle cx="28" cy="28" r="${r}" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-dasharray="${(c*f).toFixed(1)} ${c.toFixed(1)}"/></svg>`;};
          const V1=`<div class="v1"><div class="rn"></div><div class="row"><div class="ring">${ring(0.64)}<span class="ic">${RAIN}</span></div><div><span class="k">ประกาศกรมอุตุนิยมวิทยา</span><span class="t">ฝนตกหนัก</span><span class="s">พื้นที่ของคุณอยู่ในเขตเตือน · ถึง 18:00 น. (อีก 8 ชม.)</span></div><svg class="ch" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div></div>`;
          const V2=`<div class="v2"><span class="dot">${RAIN}</span><span>กรมอุตุฯ เตือน <b>ฝนตกหนัก</b> · ถึง 18:00 น.</span><svg class="ch" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>`;
          const V3=`<div class="v3"><div class="top"><span class="ic">${RAIN}</span><div><span class="k">ประกาศกรมอุตุนิยมวิทยา · พื้นที่ของคุณอยู่ในเขตเตือน</span><span class="t">ฝนตกหนัก</span></div></div><div class="tl"><i></i><em></em></div><div class="lb"><span>ออกประกาศ 05:40</span><b>ตอนนี้ · อีก 8 ชม.</b><span>สิ้นสุด 18:00</span></div></div>`;
          (async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const out={};
          for (const [n,th,v] of [['a1','light',1],['a2','light',2],['a3','light',3],['b1','dark',1],['b2','dark',2],['b3','dark',3]]){const cx=await b.createBrowserContext();const pg=await cx.newPage();await pg.setViewport({width:390,height:844,deviceScaleFactor:2});
          await pg.evaluateOnNewDocument(new Function(`localStorage.setItem('nbi_mode','easy');localStorage.setItem('nbi_th','${th}');localStorage.setItem('nbi_zone','นนทบุรี/บางใหญ่');`));
          await pg.goto(S+'/',{waitUntil:'domcontentloaded',timeout:60000});await new Promise(r=>setTimeout(r,22000));
          out[n]=await pg.evaluate((CSS,H,v)=>{const st=document.createElement('style');st.textContent=v===2?CSS:CSS.replace('.ez-x .rd{padding-top:40px}','');document.head.appendChild(st);const x=document.querySelector('#easy .ez-x');if(v===2)x.insertAdjacentHTML('afterbegin',H);else x.insertAdjacentHTML('beforebegin',H);const b=document.getElementById('ezBar');if(b)b.remove();scrollTo(0,0);return true},CSS,[V1,V2,V3][v-1],v);
          await new Promise(r=>setTimeout(r,900));await pg.screenshot({path:n+'.png',clip:{x:0,y:180,width:390,height:520}});await cx.close();}
          require('fs').writeFileSync('out.json',JSON.stringify(out));await b.close();})();
          JS
          node t.js 2> err.txt || true
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
