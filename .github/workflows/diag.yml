name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d; cd d
          A=https://telemetry.dwr.go.th/api; UA="checknam.com (+https://checknam.com)"
          for p in public/station public/stations public/reportWaterlevel public/reportWaterLevel public/waterlevel public/reportCctv public/reportRain public/dashboard public/map public/station/list public/reportStation public/report/waterlevel; do
            f=$(echo $p | tr '/' '_'); c=$(curl -s -m 30 -A "$UA" -o "$f.json" -w "%{http_code}" "$A/$p"); echo "$p $c $(wc -c < $f.json)" >> probe.txt; head -c 1200 "$f.json" > "$f.head"; rm "$f.json"; sleep 1
          done
          curl -s -m 30 -A "$UA" https://telemetry.dwr.go.th/ | grep -o 'src="[^"]*\.js"' | head -20 > js.txt || true
          for u in $(sed 's/src="//;s/"$//' js.txt | head -6); do case $u in http*) U=$u;; *) U=https://telemetry.dwr.go.th/${u#/};; esac; curl -s -m 30 "$U" | grep -o '"/api/[^"]*"\|/public/[A-Za-z/]*' | sort -u | head -80 >> apis.txt; done
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
