name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq fonts-thai-tlwg >/dev/null 2>&1 || true
          mkdir d; cd d
          curl -s -m 30 -A 'checknam.com (+https://checknam.com)' 'https://api-v3.thaiwater.net/api/v1/thaiwater30/public/warning' > warning.json || true
          npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');const fs=require('fs');const W=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const j=JSON.parse(fs.readFileSync('warning.json','utf8'));const zs=[];for(const x of j.data.slice(0,3))for(const l of x.message.split(/\n+/)){const am=(/อ\.\s?(\S+)/.exec(l)||[])[1],pv=(/จ\.\s?(\S+)/.exec(l)||[])[1];if(am&&pv)zs.push(pv+'/'+am);}
          fs.writeFileSync('zs.txt',zs.join('\n'));
          {const pg=await b.newPage();await pg.setViewport({width:430,height:900});
          await pg.evaluateOnNewDocument(()=>{localStorage.setItem('nbi_mode','full');localStorage.setItem('nbi_zone','ปราจีนบุรี/บ้านสร้าง');});
          await pg.goto('https://stage.checknam.pages.dev/',{waitUntil:'domcontentloaded'});await W(22000);
          const r=await pg.evaluate(()=>{const kmd=(a,b,c,d)=>Math.hypot((a-c)*111,(b-d)*108);const RST=riverStations();const out=[];
            RIVER_GEO.forEach((r,ri)=>{if(r.h)return;const grp=(RGROUP[r.n]||[]).concat(r.n);const ids=new Set([...(r.s||[]),...(RST.get(ri)||[])].map(String));
              const st=DATA.filter(d=>lineOk(d)&&(grp.includes(d.river_name)||ids.has(String(d.station.id)))).map(d=>({la:+d.station.tele_station_lat,lo:+d.station.tele_station_long,d,lv:mapLv(d)}));if(!st.length)return;
              const at=(la,lo)=>{let b=null,dm=1e9;for(const q of st){const dd=kmd(q.la,q.lo,la,lo);if(dd<dm){dm=dd;b=q;}}return dm<=15?b:null;};
              r.l.forEach((l,li)=>{const S=[];for(let i=1;i<l.length;i++)S.push(at((l[i-1][0]+l[i][0])/2,(l[i-1][1]+l[i][1])/2));
                for(let i=0;i<S.length;){if(S[i]){i++;continue;}let j=i,k=0;while(j<S.length&&!S[j]){k+=kmd(l[j][0],l[j][1],l[j+1][0],l[j+1][1]);j++;}
                  const A=S[i-1],B=S[j];if(k>=3)out.push({n:r.n,maj:!!r.r,m:!!r.m,li,km:+k.toFixed(1),a:A?[nm(A.d),A.lv]:null,b:B?[nm(B.d),B.lv]:null,kind:A&&B?(k<=60?'filled':'long'):(A||B?'open':'none'),mid:[+l[Math.floor((i+j)/2)][0].toFixed(3),+l[Math.floor((i+j)/2)][1].toFixed(3)]});i=j;}});});
            let est=0;try{FLOW.eachLayer(l=>{if(l.options&&l.options.dashArray==='7 6')est++;});}catch(e){} const rc=riskCore(); colorZones(); return {est, bs:[rc.L.name,rc.nearHow], z:['ปราจีนบุรี/บ้านสร้าง','สมุทรสาคร/กระทุ่มแบน','นครนายก/องครักษ์','ฉะเชิงเทรา/บางน้ำเปรี้ยว'].map(k=>[k,ZINFO[k]&&ZINFO[k].t]), gaps:out.filter(g=>!g.m&&g.kind!=='none').sort((x,y)=>y.km-x.km)};});
          fs.writeFileSync('bs.json',JSON.stringify(r,null,1));await pg.close();}
          await b.close();})();

          JS
          node t.js 2> err.txt || true
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
