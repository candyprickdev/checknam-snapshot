name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq fonts-thai-tlwg >/dev/null 2>&1 || true
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          for u in "https://ews.dwr.go.th/" "https://ewt.dwr.go.th/" "https://catalog.disaster.go.th/api/3/action/package_search?q=%E0%B9%80%E0%B8%95%E0%B8%B7%E0%B8%AD%E0%B8%99&rows=5" "https://www.disaster.go.th/rss" "https://alerthub.wmo.int/" "https://severeweather.wmo.int/v2/json/wmo_all.json" "https://cap-sources.s3.amazonaws.com/th-tmd-th/rss.xml" "https://api-v3.thaiwater.net/api/v1/thaiwater30/public/warning" "https://api-v3.thaiwater.net/api/v1/thaiwater30/public/thailand_main" "https://www.rid.go.th/index.php/th/rss" "https://www.thaipbs.or.th/rss/news.xml" "https://news.thaipbs.or.th/rss/news" "https://www.tmd.go.th/api/xml/weather-report" "https://data.tmd.go.th/api/WeatherWarningNews/v2/?uid=api&ukey=api12345" "https://www.thaiwater.net/" "https://tiwrm.hii.or.th/" ; do
            echo "== $u" >> probe.txt; curl -s -m 20 -L -A "checknam.com probe (+https://checknam.com)" -o b -w "%{http_code} %{content_type} %{size_download}\n" "$u" >> probe.txt; head -c 500 b | tr -d '\000' >> probe.txt; echo >> probe.txt; done
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
