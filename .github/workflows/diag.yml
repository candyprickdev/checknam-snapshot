name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');(async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const out={};
          for (const [nm,w,h] of [['m',390,844],['d',1280,900]]){ const pg=await b.newPage();await pg.setViewport({width:w,height:h,deviceScaleFactor:2});const errs=[];pg.on('pageerror',e=>errs.push(e.message));
            await pg.goto('https://stage.checknam.pages.dev/z/1',{waitUntil:'domcontentloaded',timeout:60000});await new Promise(r=>setTimeout(r,30000));
            const el=await pg.$('#s-rain'); if(el){ await el.scrollIntoView(); await new Promise(r=>setTimeout(r,1500));
              const sv=await pg.$('#rainH svg'); if(sv){ const bb=await sv.boundingBox(); await pg.mouse.move(bb.x+bb.width*0.3,bb.y+bb.height*0.6); await new Promise(r=>setTimeout(r,500)); }
              await el.screenshot({path:'rain-'+nm+'.png'}); }
            out[nm]={errs,txt:await pg.evaluate(()=>(document.getElementById('rainBox')||{}).innerText)}; await pg.close(); }
          require('fs').writeFileSync('out.json',JSON.stringify(out,null,1));await b.close();})();
          JS
          node t.js 2> err.txt || echo fail > out.json
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
