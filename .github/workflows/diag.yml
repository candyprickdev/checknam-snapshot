name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d; cd d; B=https://stage.checknam.pages.dev
          for u in /p/1 /p/2 /p/77 /p/78 /chaophraya /z/1; do echo "== $u $(curl -s -o /dev/null -w '%{http_code}' $B$u)" >> chk.txt; curl -s $B$u | grep -oE '<h1[^>]*>[^<]*</h1>|<p class="lead">[^<]{0,200}|<li><a href="/z/[0-9]+">[^<]*</a><span class="lv">.{0,160}|พื้นที่ใกล้เคียงต่างจังหวัด:</b>.{0,300}|"FAQPage".{0,300}|href="/p/[0-9]+">ระดับน้ำทุก[^<]*' | head -8 >> chk.txt; done
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
