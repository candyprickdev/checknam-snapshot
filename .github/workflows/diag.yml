name: diag
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq fonts-thai-tlwg >/dev/null 2>&1 || true
          mkdir d; cd d; npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const p=require('puppeteer-core');const S='https://stage.checknam.pages.dev';
          (async()=>{const out={};
          for (const [n,th,mode,z,open] of [['g1','light','easy','นนทบุรี/บางใหญ่',0],['g2','light','easy','นนทบุรี/บางใหญ่',1],['g3','dark','easy','ราชบุรี/เมืองราชบุรี',0],['g4','light','full','นนทบุรี/บางใหญ่',0],['g5','light','easy','เชียงใหม่/เมืองเชียงใหม่',0]]){const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const pg=await b.newPage();const errs=[];pg.on('pageerror',e=>errs.push(e.message));await pg.setViewport({width:390,height:844,deviceScaleFactor:2});
          await pg.evaluateOnNewDocument(new Function(`localStorage.setItem('nbi_mode','${mode}');localStorage.setItem('nbi_th','${th}');localStorage.setItem('nbi_zone',${JSON.stringify(z)});`));
          await pg.goto(S+'/',{waitUntil:'domcontentloaded',timeout:60000});await new Promise(r=>setTimeout(r,24000));
          out[n]=await pg.evaluate(open=>{const d=document.querySelector('.twd');if(d&&open)d.open=true;const b=document.getElementById('ezBar');if(b)b.remove();const t=document.getElementById('twarn');window.scrollTo(0,Math.max(0,(t?t.getBoundingClientRect().top+scrollY:0)-200));return {tw:t?t.innerText.slice(0,600):null,k:TWARN_K===llKey(place),w:TWARN&&TWARN.w&&TWARN.w.length,err:TWARN&&TWARN.error}},open);
          out[n].errs=errs;await new Promise(r=>setTimeout(r,2500));await pg.screenshot({path:n+'.png',clip:{x:0,y:0,width:390,height:open?900:560}});await b.close();}
          require('fs').writeFileSync('out.json',JSON.stringify(out,null,1));})();
          JS
          node t.js 2> err.txt || true
          rm -rf node_modules package*.json t.js
          git init -q . && git checkout -q -b diag-data && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
