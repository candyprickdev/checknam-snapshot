# ข่าวน้ำท่วมจาก RSS ของสำนักข่าว ทุก 10 นาที: รวมหัวข่าว ลิงก์ เวลา และชื่อสำนักข่าว ส่งไปเก็บที่ checknam.com (/api/news ใช้จับคู่ตามอำเภอ)
# เก็บข่าวรอบก่อนไว้ใน cache ของ Actions เพื่อให้ข่าวที่หลุดจากหน้าแรกของฟีดยังอยู่ครบ 3 วัน · ถ้าพลาดไม่ถือว่าระบบล้ม
name: news
on:
  schedule:
    - cron: "7-57/10 * * * *"
  workflow_dispatch:
concurrency:
  group: news
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: news-state.json
          key: news-state-${{ github.run_id }}
          restore-keys: news-state-
      - name: news
        env:
          KEY: ${{ secrets.SNAP_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::notice::ยังไม่ได้ตั้ง secret SNAP_KEY จึงข้าม"; exit 0; fi
          node news.js || { echo "::notice::ดึงข่าวไม่ได้รอบนี้"; exit 0; }
          RES=$(curl -s -m 60 -X POST -H "x-key: $KEY" -H "Content-Type: application/json" --data-binary "@news-out.json" "https://checknam.com/api/snap?k=news")
          echo "push=$RES"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: news-state.json
          key: news-state-${{ github.run_id }}
